<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
:root{
  --paper:#EEF2E6; --paper-2:#E3EAD8; --rule:#CBD6BF; --rule-strong:#A3B497;
  --ink:#14261C; --ink-2:#4A5C50; --ink-3:#78897D;
  --green:#1F7A4D; --red:#B5382C; --amber:#B8781A; --margin:#C94A3D;
  --shadow:0 -8px 30px rgba(20,38,28,.18); --scrim:rgba(20,38,28,.38);
}
[data-theme="dark"]{
  --paper:#111A14; --paper-2:#1A251D; --rule:#27352C; --rule-strong:#3F5346;
  --ink:#E9EFE4; --ink-2:#A9B8AD; --ink-3:#7D8C82;
  --green:#5CCB93; --red:#E8766A; --amber:#E2A93F; --margin:#D9584A;
  --shadow:0 -8px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A14; --paper-2:#1A251D; --rule:#27352C; --rule-strong:#3F5346;
    --ink:#E9EFE4; --ink-2:#A9B8AD; --ink-3:#7D8C82;
    --green:#5CCB93; --red:#E8766A; --amber:#E2A93F; --margin:#D9584A;
    --shadow:0 -8px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;font-optical-sizing:auto;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){ .fill,.bar div{transition:width .35s ease} }

#app{max-width:520px;margin:0 auto;min-height:100vh;padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 0 4px}
.brand{font-weight:600;font-size:17px}
.monthnav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px}
.monthnav h2{margin:0;font-size:18px;font-weight:500}
.monthnav button{width:40px;height:40px;border-radius:20px;font-size:24px;line-height:1;color:var(--ink-2)}
.monthnav button:active{background:var(--paper-2)}

.hero{padding:6px 0 18px;border-bottom:1px solid var(--rule)}
.hero h1{font-size:32px;line-height:1.1;font-weight:500;margin:0 0 14px;letter-spacing:-.012em}
.num{font-variant-numeric:tabular-nums}
.track{position:relative;height:6px;background:var(--paper-2);border-radius:3px;margin:8px 0 12px}
.track .fill{height:100%;background:var(--green);border-radius:3px;max-width:100%}
.track .fill.warn{background:var(--amber)}
.track .fill.over{background:var(--red)}
.track .today{position:absolute;top:-5px;width:2px;height:16px;background:var(--margin);border-radius:1px}
.track .proj{position:absolute;top:-2px;width:2px;height:10px;background:var(--amber);border-radius:1px}
.hero p{margin:0;color:var(--ink-2);font-size:14px}
.hero p button{text-decoration:underline}
.hero .actions{margin-top:14px}

.filters{display:flex;gap:8px;padding:12px 0 10px}
.filters input,.filters select{min-width:0;height:38px;padding:0 10px;border:1px solid var(--rule-strong);border-radius:8px;background:transparent}
.filters input{flex:1}
.filters select{flex:0 1 44%}

.ledger{position:relative;border-top:1px solid var(--rule)}
.ledger::before{content:'';position:absolute;left:58px;top:0;bottom:0;width:1px;background:var(--margin);opacity:.55}
.row{display:grid;grid-template-columns:50px 1fr auto;gap:0 14px;width:100%;padding:11px 0;border-bottom:1px solid var(--rule);text-align:left;align-items:center}
.row:active{background:var(--paper-2)}
.row .date{font-size:12px;color:var(--ink-3);padding-top:3px;align-self:start;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row .payee{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta .acc{color:var(--ink-3);margin-left:8px}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.amt.in{color:var(--green)}
.amt.tr{color:var(--ink-3);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:4px;border:1.5px solid var(--amber);margin-right:6px;vertical-align:1px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:-1px;flex:0 0 auto}
.empty{color:var(--ink-2);padding:30px 8px;text-align:center;line-height:1.5}

#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{padding:15px 0 13px;font-size:13px;color:var(--ink-3);position:relative}
#tabs button.on{color:var(--ink);font-weight:500}
#tabs button.on::after{content:'';position:absolute;left:28%;right:28%;bottom:8px;height:2px;background:var(--margin)}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));height:48px;padding:0 20px 0 16px;border-radius:24px;background:var(--ink);color:var(--paper);font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:21;display:flex;align-items:center;gap:6px}
#fab span{font-size:22px;line-height:1;font-weight:400}
@media (min-width:560px){#fab{right:calc(50% - 260px + 16px)}}

#sheet{position:fixed;inset:0;z-index:30;background:var(--scrim)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-width:560px;margin:0 auto}
#sheet .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px;flex:0 0 auto}
#sheet .head h3{margin:0;font-size:19px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .head button{color:var(--ink-2);height:36px;padding:0 6px;flex:0 0 auto}
#sheet .body{overflow:auto;padding:4px 18px 14px;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
#sheet .foot{display:flex;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);flex:0 0 auto}
#sheet .foot:empty{display:none}
body.sheet-open{overflow:hidden}

.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--ink-2)}
.field label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.field input,.field select,.field textarea{height:44px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:8px;background:transparent;width:100%;min-width:0}
.field textarea{height:auto;min-height:96px;padding:10px 12px;line-height:1.4}
.field input[type="checkbox"]{width:20px;height:20px;accent-color:var(--green)}
.field input[type="file"]{padding:9px 12px}
.field input.big{height:62px;font-size:32px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden;margin:6px 0 4px}
.seg button{padding:10px 0;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.btn{height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--rule-strong);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:1}
.btn.danger{color:var(--red);border-color:transparent}
.btn.small{height:34px;padding:0 12px;font-size:13.5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.note{font-size:13px;color:var(--ink-2);margin:6px 0 10px;line-height:1.45}
.warn{color:var(--amber)}
.bad{color:var(--red)}
.good{color:var(--green)}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.colors button{width:32px;height:32px;border-radius:16px;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}

.section{margin:22px 0 0}
.section h3{margin:0 0 8px;font-size:17px;font-weight:600}
.section h3 small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:8px}
.totals{display:flex;justify-content:space-between;padding:4px 0 2px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.insight{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.45;width:100%;text-align:left}
.insight i{flex:0 0 4px;border-radius:2px;background:var(--ink-3);align-self:stretch}
.insight.red i{background:var(--red)} .insight.amber i{background:var(--amber)} .insight.green i{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:16px;font-size:13px;border:1px solid var(--rule);color:var(--ink-2)}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip.ok{border-color:var(--green);color:var(--green)}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.chip.over{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.pbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 10px}
.pbar .pseg{height:100%;min-width:3px}
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:center;width:100%;text-align:left}
.crow .cname{display:flex;align-items:center;min-width:0}
.crow .cname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .amt{font-variant-numeric:tabular-nums;font-weight:500}
.crow .pct{color:var(--ink-3);font-size:12.5px;margin-left:6px;flex:0 0 auto}
.crow .cdelta{grid-column:1/-1;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.crow .bar{grid-column:1/-1;margin-top:2px}
.up{color:var(--red)} .down{color:var(--green)}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.cmp th,.cmp td{padding:8px 3px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp th{font-weight:500;color:var(--ink-2);font-size:12px}
.cmp tr.total td{font-weight:600}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;border-bottom:1px solid var(--rule)}
.flow .m{display:flex;flex-direction:column;align-items:center}
.flow .bars{display:flex;gap:3px;align-items:flex-end;height:120px;justify-content:center}
.flow .stack{display:flex;flex-direction:column-reverse;height:100%;width:12px;justify-content:flex-start}
.flow .stack i{display:block;width:100%;border-radius:2px 2px 0 0}
.flow i.i{background:var(--green)}
.flow i.o{background:var(--ink-2)}
.flow i.p{border:1.5px dashed var(--ink-3);border-bottom:0;background:transparent}
.flow .lbl{font-size:11.5px;color:var(--ink-3);padding:6px 0 4px;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.p{border:1.5px dashed var(--ink-3);background:transparent;box-sizing:border-box}
.krow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.krow .amt{font-variant-numeric:tabular-nums;font-weight:500}
.krow.total{font-weight:600;border-bottom:0}
.krow .sub{color:var(--ink-3);font-size:12.5px;margin-left:8px;font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{padding:10px 12px;border:1px solid var(--rule);border-radius:10px;min-width:0}
.tile .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile .d{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}

.bgroup{margin:18px 0 0}
.brow{padding:10px 0;border-bottom:1px solid var(--rule)}
.brow.child{padding-left:18px}
.brow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brow .name{font-weight:500;display:flex;align-items:center;min-width:0;text-align:left}
.brow.parent .name{font-size:16px}
.brow .nums{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.brow .nums input{width:92px;height:32px;text-align:right;border:1px solid var(--rule-strong);border-radius:6px;background:transparent;padding:0 8px;font-variant-numeric:tabular-nums}
.bar{height:5px;background:var(--paper-2);border-radius:3px;margin-top:8px;overflow:hidden;position:relative}
.bar div{height:100%;border-radius:3px;max-width:100%}
.bar div.over{background:var(--red)!important}
.bar .tick{position:absolute;top:0;width:2px;height:100%;background:var(--amber)}

.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--rule);text-align:left}
.item .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.item .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.item .chev{color:var(--ink-3)}
.item.child{padding-left:18px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.kv b{color:var(--ink);font-weight:500;text-align:right}

table.prev{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.prev td,.prev th{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.prev th{font-weight:500;color:var(--ink-2)}
.prev td.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:12px 0 4px;font-size:14px}
.counts span{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:6px 0}
.counts b{font-variant-numeric:tabular-nums;font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;display:flex;gap:18px;align-items:center;z-index:40;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{color:var(--paper);font-weight:600;text-decoration:underline;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="brand">Ledger</div></div>
  <main id="view"></main>
</div>

<nav id="tabs" aria-label="Sections"><div class="in">
  <button data-tab="home" class="on">Home</button>
  <button data-tab="txns">Ledger</button>
  <button data-tab="budget">Limits</button>
  <button data-tab="fuel">Fuel</button>
  <button data-tab="more">More</button>
</div></nav>
<button id="fab" data-act="add-txn" aria-label="Add transaction"><span>+</span><b id="fabLabel">Add</b></button>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="head"><h3 id="sheetTitle"></h3><button data-act="close-sheet" aria-label="Close">Close</button></div>
    <div class="body" id="sheetBody"></div>
    <div class="foot" id="sheetFoot"></div>
  </div>
</div>
<div id="toast" hidden></div>
<noscript>Ledger needs JavaScript to run.</noscript>

<script>
'use strict';
const APP_VERSION='0.2.0';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

/* ================= storage ================= */
const DB_NAME='ledger', DB_VERSION=2;
const STORES=['meta','accounts','categories','transactions','budgets','rules','importBatches','fuel'];
let db=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{const d=req.result;for(const s of STORES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});}};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function dbPutMany(store,arr){return new Promise((res,rej)=>{if(!arr.length)return res();const t=db.transaction(store,'readwrite');const os=t.objectStore(store);for(const o of arr)os.put(o);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function dbPut(store,obj){return dbPutMany(store,[obj]);}
function dbDeleteMany(store,ids){return new Promise((res,rej)=>{if(!ids.length)return res();const t=db.transaction(store,'readwrite');const os=t.objectStore(store);for(const id of ids)os.delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function dbClear(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

/* ================= state ================= */
const S={accounts:[],categories:[],transactions:[],budgets:[],rules:[],batches:[],fuel:[],meta:{},
  tab:'home',month:'',search:'',filterAccount:'',persisted:null,usage:null};
let deferredInstall=null;
let IMP=null;

const PALETTE=['#2F6DB5','#1F7A4D','#C25E1A','#7B4FB5','#1A8A9E','#B5382C','#B8781A','#C2456F','#5E7F1F','#8A6A32','#2A9D8F','#6B7C70'];
const NEUTRAL='#6B7C70';
const SEED=[
  {name:'Income',income:true,color:'#1F7A4D',children:['Salary','Other income']},
  {name:'Home',color:'#2F6DB5',children:['Rent or bond','Levies and rates','Electricity and water','Internet and phone','Household']},
  {name:'Everyday',color:'#C25E1A',children:['Groceries','Eating out','Coffee and snacks']},
  {name:'Transport',color:'#7B4FB5',children:[['Fuel','cat_fuel'],'Car costs','Rides, parking and tolls']},
  {name:'Personal',color:'#1A8A9E',children:['Clothing','Health and medical','Gym and sport','Personal care']},
  {name:'Leisure',color:'#C2456F',children:['Entertainment','Subscriptions','Holidays and trips','Gifts and giving']},
  {name:'Money',color:'#B8781A',children:['Insurance','Savings and investments','Debt repayments','Bank fees']},
  {name:'Other',color:'#8A6A32',children:['Other']},
];
const ACCOUNT_TYPES={cheque:'Cheque / current',savings:'Savings',credit:'Credit card',cash:'Cash',loan:'Loan',investment:'Investment'};

/* ================= utilities ================= */
const uid=()=>(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const nowISO=()=>new Date().toISOString();
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function todayStr(){return ymd(new Date());}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
function monthLabel(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'long',year:'numeric'});}
function monthName(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'long'});}
function monthShort(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'short'});}
function shiftMonth(mk,delta){const [y,m]=mk.split('-').map(Number);return monthKey(new Date(y,m-1+delta,1));}
function daysInMonth(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate();}
function dateLabel(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-ZA',{day:'2-digit',month:'short'});}
function longDate(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-ZA',{day:'numeric',month:'long'});}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
const fmtFull=new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtRound=new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:0});
const fmt=c=>fmtFull.format((c||0)/100);
const fmtShort=c=>fmtRound.format(Math.round((c||0)/100));
const fmtKm=n=>Math.round(n||0).toLocaleString('en-ZA')+' km';
const fmtNum=(n,d=1)=>Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:d,maximumFractionDigits:d});
function parseAmountInput(s){s=String(s??'').trim().replace(/[rR\s\u00a0\u202f]/g,'').replace(',','.');if(!s)return null;const n=Number(s);if(!isFinite(n))return null;return Math.round(n*100);}
function parseNum(s){s=String(s??'').trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');if(!s)return null;const n=Number(s);return isFinite(n)?n:null;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normText(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,(m,p,c)=>p+c.toUpperCase());}
function cleanPayee(desc){
  let s=String(desc||'').replace(/\s+/g,' ').trim();
  s=s.replace(/^(pos purchase|card purchase|debit card purchase|purchase|debit order|magtape debit|magtape credit|fnb app payment to|payment to|payment from|eft payment|internet pmt to|internet pmt from|cheque card purchase)\s*[:\-]?\s*/i,'');
  if(s&&/[a-z]/i.test(s)&&s===s.toUpperCase())s=titleCase(s);
  return s||String(desc||'').trim();
}

const live=()=>S.transactions.filter(t=>!t.deletedAt);
const catById=id=>S.categories.find(c=>c.id===id);
const accById=id=>S.accounts.find(a=>a.id===id);

const inMonth=(t,mk)=>t.date.startsWith(mk);

/* ================= categories ================= */
const bySort=(a,b)=>(a.sort??0)-(b.sort??0)||a.name.localeCompare(b.name);
const cats=()=>S.categories.filter(c=>!c.deletedAt);
const topCats=()=>cats().filter(c=>!c.parentId&&!c.system).sort(bySort);
const childrenOf=id=>cats().filter(c=>c.parentId===id).sort(bySort);
function topOf(id){const c=catById(id);if(!c)return null;return c.parentId?(catById(c.parentId)||c):c;}
const colorOf=id=>topOf(id)?.color||NEUTRAL;
const isIncomeCat=id=>!!topOf(id)?.income;
const catName=id=>catById(id)?.name||'Uncategorised';
function fullName(id){const c=catById(id);if(!c)return 'Uncategorised';const p=c.parentId?catById(c.parentId):null;return p?`${p.name} › ${c.name}`:c.name;}
const inCat=(t,catId)=>t.categoryId===catId||catById(t.categoryId)?.parentId===catId;
function nextColor(){const used=new Set(topCats().map(c=>c.color));return PALETTE.find(c=>!used.has(c))||PALETTE[topCats().length%PALETTE.length];}
function seedCategories(){
  const list=[];let sort=0;
  for(const p of SEED){
    const pid=uid();list.push({id:pid,name:p.name,income:!!p.income,color:p.color,sort:sort++,createdAt:nowISO()});
    for(const ch of p.children){const [name,id]=Array.isArray(ch)?ch:[ch,uid()];list.push({id,name,parentId:pid,sort:sort++,createdAt:nowISO()});}
  }
  list.push({id:'cat_transfer',name:'Transfer',system:true,color:NEUTRAL,sort:900,createdAt:nowISO()});
  list.push({id:'cat_uncat',name:'Uncategorised',system:true,color:NEUTRAL,sort:901,createdAt:nowISO()});
  return list;
}
async function migrateCategories(){
  // v0.1 stored flat categories with a text "group"; turn each group into a parent category.
  const old=S.categories.filter(c=>!c.system&&c.parentId===undefined&&c.group!==undefined);
  if(!old.length)return;
  const parents={};let i=0;
  for(const c of old){
    const g=c.group||'Other';
    if(!parents[g])parents[g]={id:uid(),name:g,income:!!c.income,color:PALETTE[i++%PALETTE.length],sort:i,createdAt:nowISO()};
    c.parentId=parents[g].id;delete c.group;delete c.income;
  }
  for(const c of S.categories)if(c.system&&!c.color)c.color=NEUTRAL;
  S.categories.push(...Object.values(parents));
  await dbPutMany('categories',S.categories);
}
function fuelCatId(){
  const c=cats().find(c=>c.id==='cat_fuel')||cats().find(c=>c.name.toLowerCase()==='fuel'&&!c.system);
  return c?c.id:null;
}
async function ensureFuelCat(){
  if(fuelCatId())return;
  const transport=topCats().find(c=>/transport/i.test(c.name));
  const c=transport?{id:'cat_fuel',name:'Fuel',parentId:transport.id,sort:50,createdAt:nowISO()}:{id:'cat_fuel',name:'Fuel',color:nextColor(),sort:50,createdAt:nowISO()};
  S.categories.push(c);await dbPut('categories',c);
}
function catOptions(kind,selected){

  }
  html+=`<optgroup label="Other"><option value="cat_uncat" ${selected==='cat_uncat'?'selected':''}>Uncategorised</option></optgroup>`;
  return html;
}

async function loadAll(){
  const [accounts,categories,transactions,budgets,rules,batches,fuel,metaRows]=await Promise.all(
    ['accounts','categories','transactions','budgets','rules','importBatches','fuel','meta'].map(dbAll));
  Object.assign(S,{accounts,categories,transactions,budgets,rules,batches,fuel});
  S.meta={};for(const m of metaRows)S.meta[m.id]=m.value;
  if(!S.categories.length){S.categories=seedCategories();await dbPutMany('categories',S.categories);}

/* ================= money maths ================= */
function isSpend(t){if(isTransfer(t))return false;if(isIncomeCat(t.categoryId))return false;if(t.categoryId==='cat_uncat'&&t.amount>0)return false;return true;}
function spentLeaf(mk){const m={};for(const t of live()){if(!inMonth(t,mk)||!isSpend(t))continue;m[t.categoryId]=(m[t.categoryId]||0)-t.amount;}return m;}
function spentTop(mk){const leaf=spentLeaf(mk),m={};for(const [id,v] of Object.entries(leaf)){const t=topOf(id);const k=t?t.id:'cat_uncat';m[k]=(m[k]||0)+v;}return m;}
function spentFor(catId,mk){const leaf=spentLeaf(mk);let v=leaf[catId]||0;for(const c of childrenOf(catId))v+=leaf[c.id]||0;return v;}
function incomeIn(mk){let s=0;for(const t of live()){if(!inMonth(t,mk)||isTransfer(t))continue;if(isIncomeCat(t.categoryId)||(t.categoryId==='cat_uncat'&&t.amount>0))s+=t.amount;}return s;}
function limitFor(catId,mk){return S.budgets.find(b=>b.categoryId===catId&&b.month===mk)?.amount||0;}
function effectiveLimit(catId,mk){const own=limitFor(catId,mk);if(own)return {amount:own,derived:false};const sum=childrenOf(catId).reduce((s,c)=>s+limitFor(c.id,mk),0);return {amount:sum,derived:true};}
function totalLimit(mk){return topCats().filter(c=>!c.income).reduce((s,c)=>s+effectiveLimit(c.id,mk).amount,0);}
function monthTotals(mk){const spent=Object.values(spentLeaf(mk)).reduce((a,b)=>a+b,0);return {income:incomeIn(mk),spent,budgeted:totalLimit(mk)};}
function accountBalance(a){let b=a.openingBalance||0;for(const t of live())if(t.accountId===a.id)b+=t.amount;return b;}
async function setBudget(catId,mk,amount){
  const id=catId+'|'+mk;
  S.budgets=S.budgets.filter(b=>b.id!==id);
  if(amount>0){const b={id,categoryId:catId,month:mk,amount};S.budgets.push(b);await dbPut('budgets',b);}
  else await dbDeleteMany('budgets',[id]);
}
function spendBetween(from,to,catId){let s=0;for(const t of live()){if(t.date<from||t.date>to||!isSpend(t))continue;if(catId&&!inCat(t,catId))continue;s-=t.amount;}return s;}
function projectionFor(mk,catId){
  const today=todayStr(),cur=today.slice(0,7);
  const spentNow=catId?spentFor(catId,mk):monthTotals(mk).spent;
  const dim=daysInMonth(mk);
  if(mk<cur)return {projected:spentNow,final:true,elapsed:dim,dim};
  if(mk>cur)return null;
  const d=Number(today.slice(8));
  const daily=spendBetween(addDays(today,-29),today,catId)/30;
  return {projected:Math.max(spentNow,Math.round(spentNow+daily*(dim-d))),elapsed:d,dim,daily,final:false};
}
function statusOf(spent,limit){if(!limit)return 'none';if(spent>limit)return 'over';if(spent/limit>=0.85)return 'warn';return 'ok';}
function avgPrev3(catId,mk){const vals=[1,2,3].map(i=>spentFor(catId,shiftMonth(mk,-i))).filter(v=>v>0);return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;}
function deltaHTML(cur,prev,label){
  if(!prev&&!cur)return '';
  if(!prev)return `<span>new this month</span>`;
  const diff=cur-prev;const pct=Math.round(Math.abs(diff)/prev*100);
  if(Math.abs(diff)<5000||pct<3)return `<span>about the same as ${esc(label)}</span>`;
  return `<span class="${diff>0?'up':'down'}">${diff>0?'▲':'▼'} ${fmtShort(Math.abs(diff))} (${pct}%) vs ${esc(label)}</span>`;
}
function applyRules(text){
  const n=normText(text);if(!n)return {};
  for(const r of S.rules){const m=normText(r.match);if(m&&n.includes(m))return {categoryId:r.categoryId,payee:r.rename||null};}
  return {};
}
function lastCategoryForPayee(payee){
  const p=String(payee||'').trim().toLowerCase();if(!p)return null;
  const known=live().filter(t=>!isTransfer(t)&&t.payee&&t.categoryId!=='cat_uncat').sort((a,b)=>b.date.localeCompare(a.date));
  const exact=known.find(t=>t.payee.trim().toLowerCase()===p);
  if(exact)return exact.categoryId;
  // Bank SMSes and statements add branch names ("Woolworths Sandton"): match the longest known payee contained in the new one.
  const n=normText(p);let best=null;
  for(const t of known){const k=normText(t.payee);if(k.length>=4&&n.includes(k)&&(!best||k.length>best.k.length))best={k,categoryId:t.categoryId};}
  return best?best.categoryId:null;
}
function payeeOptions(){
  const counts={};
  for(const t of live()){if(!t.payee||isTransfer(t))continue;counts[t.payee]=(counts[t.payee]||0)+1;}
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,300).map(([p])=>`<option value="${esc(p)}">`).join('');
}

/* ================= insights ================= */
function insights(mk){
  const out=[];const tot=monthTotals(mk);const today=todayStr(),cur=today.slice(0,7);const pr=projectionFor(mk);const mn=monthName(mk);
  const midMonth=pr&&!pr.final&&pr.elapsed>=3;
  if(midMonth&&tot.budgeted){const diff=pr.projected-tot.budgeted;out.push(diff>0?{tone:'red',text:`At this pace ${mn} ends about ${fmtShort(diff)} over your limits, around ${fmtShort(pr.projected)} in total.`}:{tone:'green',text:`At this pace ${mn} ends about ${fmtShort(-diff)} under your limits, around ${fmtShort(pr.projected)} in total.`});}
  else if(midMonth&&tot.spent)out.push({tone:'ink',text:`At this pace you'll spend about ${fmtShort(pr.projected)} in ${mn}. Set limits to be told when a category runs hot.`,tab:'budget'});
  const limited=cats().filter(c=>!c.system&&!isIncomeCat(c.id)&&effectiveLimit(c.id,mk).amount>0);
  const limitLines=[];
  for(const c of limited){
    const l=effectiveLimit(c.id,mk).amount,s=spentFor(c.id,mk);
    if(s>l)limitLines.push({rank:2,over:(s-l)/l,tone:'red',text:`${c.name} is ${fmtShort(s-l)} over its ${fmtShort(l)} limit.`,id:c.id});
    else if(midMonth){const cp=projectionFor(mk,c.id);if(cp&&cp.projected>l*1.02)limitLines.push({rank:1,over:(cp.projected-l)/l,tone:'amber',text:`${c.name} is heading for about ${fmtShort(cp.projected)}, past its ${fmtShort(l)} limit.`,id:c.id});}
  }
  limitLines.sort((a,b)=>b.rank-a.rank||b.over-a.over);
  out.push(...limitLines.slice(0,3));
  if(mk===cur&&tot.spent){
    const d=Number(today.slice(8));const prev=shiftMonth(mk,-1);
    const prevTo=spendBetween(prev+'-01',prev+'-'+pad(Math.min(d,daysInMonth(prev))));
    if(prevTo>0){const diff=tot.spent-prevTo;const pct=Math.round(Math.abs(diff)/prevTo*100);if(pct>=10)out.push({tone:diff>0?'amber':'green',text:`By day ${d} you've spent ${fmtShort(tot.spent)}, ${pct}% ${diff>0?'more':'less'} than by this day in ${monthName(prev)}.`});}
  }
  if(!pr||pr.final||pr.elapsed>=10){
    let best=null;
    for(const p of topCats().filter(c=>!c.income)){
      const a=avgPrev3(p.id,mk);if(a<20000)continue;
      const s=(pr&&!pr.final)?(projectionFor(mk,p.id)?.projected||0):spentFor(p.id,mk);
      const r=(s-a)/a;if(!best||Math.abs(r)>Math.abs(best.r))best={p,a,s,r};
    }
    if(best&&Math.abs(best.r)>=0.25)out.push({tone:best.r>0?'amber':'green',text:`${best.p.name} is running ${Math.round(Math.abs(best.r)*100)}% ${best.r>0?'above':'below'} its three-month average of ${fmtShort(best.a)}.`,id:best.p.id});
  }
  const byPayee={};for(const t of live()){if(!inMonth(t,mk)||!isSpend(t)||t.amount>=0)continue;const k=t.payee||'Unknown';byPayee[k]=(byPayee[k]||0)-t.amount;}
  const top=Object.entries(byPayee).sort((a,b)=>b[1]-a[1])[0];
  if(top&&tot.spent>0)out.push({tone:'ink',text:`Most went to ${top[0]}: ${fmtShort(top[1])}, ${Math.round(top[1]/tot.spent*100)}% of the month.`});
  const fs=fuelStats(mk);
  if(fs.cost)out.push({tone:'ink',text:`Fuel: ${fmtShort(fs.cost)}${fs.km?` for ${fmtKm(fs.km)}, ${fmt(fs.costPerKm)} per km`:''}.`,tab:'fuel'});
  return out.slice(0,7);
}

/* ================= UI plumbing ================= */
let toastTimer=null;
function toast(msg,opts={}){
  const el=$('#toast');
  el.innerHTML=`<span>${esc(msg)}</span>${opts.action?`<button id="toastBtn">${esc(opts.action)}</button>`:''}`;
  el.hidden=false;
  if(opts.action)$('#toastBtn').onclick=()=>{el.hidden=true;opts.onAction();};
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{el.hidden=true;},opts.duration||(opts.action?7000:2400));
}
function openSheet(title,body,foot){

}

function applyTheme(){const t=S.meta.theme||'';if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;}

function monthNav(){return `<div class="monthnav"><button data-act="month" data-d="-1" aria-label="Previous month">‹</button><h2>${monthLabel(S.month)}</h2><button data-act="month" data-d="1" aria-label="Next month">›</button></div>`;}
function onboardingHero(){return `<section class="hero"><h1>Start with an account</h1><p>Add the account you spend from. Then log a purchase with Add, share a bank SMS to Ledger, or import a statement under More.</p><div class="actions"><button class="btn primary" data-act="add-account">Add account</button></div></section>`;}
function todayMarker(mk){const today=todayStr(),cur=today.slice(0,7);const pct=mk===cur?Number(today.slice(8))/daysInMonth(mk)*100:(mk<cur?100:0);return pct>0&&pct<100?`<div class="today" style="left:${pct.toFixed(1)}%" title="Today"></div>`:'';}
function proportionBar(entries){
  const total=entries.reduce((s,e)=>s+Math.max(0,e.value),0);if(!total)return '';
  return `<div class="pbar">${entries.map(e=>`<button class="pseg" data-act="cat-detail" data-id="${e.id}" style="width:${(Math.max(0,e.value)/total*100).toFixed(2)}%;background:${e.color};opacity:${e.opacity??1}" title="${esc(e.name)} ${fmtShort(e.value)}" aria-label="${esc(e.name)} ${fmtShort(e.value)}"></button>`).join('')}</div>`;
}
function limitBar(spent,limit,color,projected){
  if(!limit)return '';
  const pct=Math.min(100,Math.max(0,spent/limit*100));const st=statusOf(spent,limit);
  const tick=projected&&projected>spent&&projected/limit<1?`<div class="tick" style="left:${(projected/limit*100).toFixed(1)}%" title="Projected"></div>`:'';
  return `<div class="bar"><div class="${st}" style="width:${pct.toFixed(1)}%;background:${color}"></div>${tick}</div>`;
}
function sixMonthBars(mk,valueFn,color){
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(mk,-i));
  const vals=months.map(valueFn);
  const max=Math.max(1,...vals.map(v=>v.projected||v.value));
  return `<div class="flow">${months.map((m,i)=>{const v=vals[i];const extra=v.projected&&v.projected>v.value?v.projected-v.value:0;return `<div class="m"><div class="bars"><div class="stack"><i class="o" style="height:${(v.value/max*100).toFixed(1)}%;background:${color}"></i>${extra?`<i class="p" style="height:${(extra/max*100).toFixed(1)}%"></i>`:''}</div></div><div class="lbl">${monthShort(m)}</div></div>`;}).join('')}</div>`;
}

/* ================= Home (dashboard) ================= */
function viewHome(){
  if(!S.accounts.length)return `${monthNav()}${onboardingHero()}`;
  const mk=S.month;const tot=monthTotals(mk);const pr=projectionFor(mk);
  let hero;
  if(tot.budgeted>0){
    const left=tot.budgeted-tot.spent;const pct=Math.min(100,tot.spent/tot.budgeted*100);const st=statusOf(tot.spent,tot.budgeted);
    const proj=pr&&!pr.final&&pr.projected>tot.spent&&pr.projected<tot.budgeted?`<div class="proj" style="left:${(pr.projected/tot.budgeted*100).toFixed(1)}%" title="Projected"></div>`:'';
    hero=`<section class="hero"><h1><span class="num">${fmtShort(Math.abs(left))}</span> ${left>=0?'left':'over'} in ${monthName(mk)}</h1>
      <div class="track"><div class="fill ${st}" style="width:${pct.toFixed(1)}%"></div>${proj}${todayMarker(mk)}</div>
      <p>Spent ${fmtShort(tot.spent)} of ${fmtShort(tot.budgeted)} in limits.${tot.income?` ${fmtShort(tot.income)} came in.`:''}${pr&&!pr.final&&pr.elapsed>=3?` Heading for about ${fmtShort(pr.projected)}.`:''}</p></section>`;
  }else{
    const pct=tot.income?Math.min(100,tot.spent/tot.income*100):0;
    hero=`<section class="hero"><h1><span class="num">${fmtShort(tot.spent)}</span> spent in ${monthName(mk)}</h1>
      <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div>${todayMarker(mk)}</div>
      <p>${tot.income?`${fmtShort(tot.income)} in, ${fmtShort(tot.spent)} out.`:'Nothing in yet.'} ${pr&&!pr.final&&pr.elapsed>=3&&tot.spent?`Heading for about ${fmtShort(pr.projected)}.`:''} <button data-act="tab" data-tab="budget">Set limits</button> to see what's left.</p></section>`;
  }
  const ins=insights(mk);
  const insHTML=ins.length?`<div class="section"><h3>What stands out</h3>${ins.map(i=>{const act=i.id?`data-act="cat-detail" data-id="${i.id}"`:i.tab?`data-act="tab" data-tab="${i.tab}"`:'';const tag=act?'button':'div';return `<${tag} class="insight ${i.tone}" ${act}><i></i><span>${esc(i.text)}</span></${tag}>`;}).join('')}</div>`:'';

  const totLast=monthTotals(prev).spent,totAvg=[1,2,3].map(i=>monthTotals(shiftMonth(mk,-i)).spent).filter(v=>v>0);
  const cmp=cmpRows.length?`<div class="section"><h3>Compared with previous months</h3><table class="cmp"><thead><tr><th>Category</th><th>${monthShort(mk)}</th><th>${monthShort(prev)}</th><th>3-mo avg</th></tr></thead><tbody>${cmpRows.map(r=>`<tr><td><i class="swatch" style="background:${r.c.color}"></i>${esc(r.c.name)}</td><td class="${r.now>r.avg&&r.avg?'up':''}">${fmtShort(r.now)}</td><td>${fmtShort(r.last)}</td><td>${r.avg?fmtShort(r.avg):'—'}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${fmtShort(tot.spent)}</td><td>${fmtShort(totLast)}</td><td>${totAvg.length?fmtShort(totAvg.reduce((a,b)=>a+b,0)/totAvg.length):'—'}</td></tr></tbody></table></div>`:'';

    <div class="legend"><span><i style="background:var(--green)"></i>In</span><span><i style="background:var(--ink-2)"></i>Out</span><span><i class="p"></i>Projected</span><span style="margin-left:auto">${monthShort(mk)} net ${fmtShort(tot.income-tot.spent)}</span></div></div>`;
  let net=0;
  const accts=S.accounts.map(a=>{const b=accountBalance(a);net+=b;return `<div class="krow"><span>${esc(a.name)}<span class="sub">${ACCOUNT_TYPES[a.type]||''}</span></span><span class="amt ${b<0?'bad':''}">${fmt(b)}</span></div>`;}).join('');

  }
  const txns=live().filter(t=>inMonth(t,mk)&&inCat(t,id)&&!isTransfer(t)).sort((a,b)=>b.date.localeCompare(a.date));
  const list=txns.length?`<div class="ledger">${txns.map(t=>`<button class="row" data-act="edit-txn" data-id="${t.id}"><span class="date">${dateLabel(t.date)}</span><span class="main"><span class="payee">${esc(t.payee||catName(t.categoryId))}</span><span class="meta">${esc(catName(t.categoryId))}<span class="acc">${esc(accById(t.accountId)?.name||'')}</span></span></span><span class="amt ${t.amount>0?'in':''}">${fmt(t.amount)}</span></button>`).join('')}</div>`:`<p class="empty">Nothing here in ${monthLabel(mk)}.</p>`;
  const html=`<p class="note" style="margin-top:0"><i class="swatch" style="background:${color}"></i>${status}</p>${limitBar(s,lim.amount,color,pr&&!pr.final?pr.projected:0)}${proj}
    <div class="section"><h3>Last six months</h3>${bars}${cmp}</div>
    <div class="field" style="margin-top:16px"><label for="cdLimit">Limit for ${monthName(mk)} (rand)</label><input id="cdLimit" inputmode="decimal" value="${limitFor(id,mk)?(limitFor(id,mk)/100).toFixed(0):''}" placeholder="${lim.derived&&lim.amount?(lim.amount/100).toFixed(0)+' from sub-categories':'No limit'}"></div>
    ${subs}<div class="section"><h3>Transactions<small>${monthShort(mk)}</small></h3>${list}</div>`;
  openSheet(fullName(id),html,`<button class="btn" data-act="close-sheet">Done</button>${c.system?'':`<button class="btn primary" data-act="edit-category" data-id="${id}">Edit category</button>`}`);
  $('#cdLimit').onchange=async()=>{const v=parseAmountInput($('#cdLimit').value);await setBudget(id,mk,v==null?0:v);openCatDetail(id);render();toast('Limit saved');};
}

/* ================= Limits (budget) ================= */
function viewBudget(){
  if(!S.accounts.length)return `${monthNav()}<p class="empty">Add an account first. Then set a monthly limit for each category or sub-category here.</p>`;
  const mk=S.month;const leaf=spentLeaf(mk);const {income}=monthTotals(mk);const pr=projectionFor(mk);const mid=pr&&!pr.final&&pr.elapsed>=3;
  let html='',totalL=0,totalS=0;
  for(const p of topCats().filter(c=>!c.income)){
    const kids=childrenOf(p.id);const pl=effectiveLimit(p.id,mk);const ps=spentFor(p.id,mk);totalL+=pl.amount;totalS+=ps;
    const pst=statusOf(ps,pl.amount);
    html+=`<div class="bgroup"><div class="brow parent"><div class="top"><button class="name" data-act="cat-detail" data-id="${p.id}"><i class="swatch" style="background:${p.color}"></i>${esc(p.name)}</button><span class="nums"><span class="${pst==='over'?'bad':pst==='warn'?'warn':''}">${fmtShort(ps)}</span><span>of</span><input inputmode="decimal" data-budget="${p.id}" value="${limitFor(p.id,mk)?(limitFor(p.id,mk)/100).toFixed(0):''}" placeholder="${pl.derived&&pl.amount?(pl.amount/100).toFixed(0):'—'}" aria-label="Limit for ${esc(p.name)}"></span></div>${limitBar(ps,pl.amount,p.color,mid?projectionFor(mk,p.id)?.projected:0)}</div>`;
    for(const c of kids){
      const l=limitFor(c.id,mk),s=leaf[c.id]||0;const st=statusOf(s,l);
      html+=`<div class="brow child"><div class="top"><button class="name" data-act="cat-detail" data-id="${c.id}">${esc(c.name)}</button><span class="nums"><span class="${st==='over'?'bad':st==='warn'?'warn':''}">${fmtShort(s)}</span><span>of</span><input inputmode="decimal" data-budget="${c.id}" value="${l?(l/100).toFixed(0):''}" placeholder="—" aria-label="Limit for ${esc(c.name)}"></span></div>${limitBar(s,l,p.color,mid?projectionFor(mk,c.id)?.projected:0)}</div>`;
    }
    if(leaf[p.id]>0&&kids.length)html+=`<div class="brow child"><div class="top"><span class="name">${esc(p.name)} (general)</span><span class="nums">${fmtShort(leaf[p.id])}</span></div></div>`;
    html+='</div>';
  }
  if(leaf.cat_uncat>0)html+=`<div class="bgroup"><div class="brow parent"><div class="top"><button class="name" data-act="cat-detail" data-id="cat_uncat"><i class="swatch" style="background:${NEUTRAL}"></i>Uncategorised</button><span class="nums">${fmtShort(leaf.cat_uncat)}</span></div></div></div>`;
  let incHTML='';
  for(const p of topCats().filter(c=>c.income)){
    const rows=[p,...childrenOf(p.id)].map(c=>{let v=0;for(const t of live())if(inMonth(t,mk)&&!isTransfer(t)&&t.categoryId===c.id)v+=t.amount;return v?`<div class="brow ${c.id===p.id?'parent':'child'}"><div class="top"><span class="name">${c.id===p.id?`<i class="swatch" style="background:${p.color}"></i>`:''}${esc(c.name)}</span><span class="nums good">${fmtShort(v)}</span></div></div>`:'';}).join('');
    if(rows)incHTML+=`<div class="bgroup">${rows}</div>`;
  }
  const prev=shiftMonth(mk,-1);const prevHas=S.budgets.some(b=>b.month===prev);
  const copy=(!totalL&&prevHas)?`<div class="actions"><button class="btn" data-act="copy-budget">Use ${monthName(prev)}'s limits</button></div>`:'';
  const summary=`<div class="totals"><span>Limits ${fmtShort(totalL)}</span><span>Spent ${fmtShort(totalS)}</span><span>${totalL?`${fmtShort(Math.abs(totalL-totalS))} ${totalL>=totalS?'left':'over'}`:''}</span></div>${income?`<div class="totals"><span>Income so far</span><span class="good">${fmtShort(income)}</span></div>`:''}`;
  return `${monthNav()}${summary}${copy}<div class="actions"><button class="btn" data-act="categories">Edit categories</button></div>${html}${incHTML}<p class="note" style="margin-top:14px">Type a rand amount next to a category or sub-category to set its limit for ${monthName(mk)}. A category with no limit of its own uses the sum of its sub-categories. The amber tick on a bar is where this month is heading at the current pace.</p>`;
}

/* ================= Fuel ================= */
const fuelLive=()=>S.fuel.filter(f=>!f.deletedAt).sort((a,b)=>a.date.localeCompare(b.date)||a.odometer-b.odometer);
function fuelStats(mk){
  const list=fuelLive();let km=0,litres=0,cost=0,n=0;
  for(let i=0;i<list.length;i++){const f=list[i];if(!f.date.startsWith(mk))continue;n++;cost+=f.cost;litres+=f.litres;if(i>0&&f.odometer>list[i-1].odometer)km+=f.odometer-list[i-1].odometer;}
  return {km,litres,cost,n,ppl:litres?cost/litres:0,costPerKm:km?cost/km:0};
}
function consumption(){
  const list=fuelLive();const segs=[];let lastFull=-1;
  for(let i=0;i<list.length;i++){
    if(!list[i].full)continue;
    if(lastFull>=0){let litres=0;for(let j=lastFull+1;j<=i;j++)litres+=list[j].litres;const km=list[i].odometer-list[lastFull].odometer;if(km>0&&litres>0)segs.push(litres/km*100);}
    lastFull=i;
  }
  const recent=segs.slice(-6);return recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:null;
}
function drivingPace(){
  const list=fuelLive();if(list.length<2)return null;
  const last=list[list.length-1];const cutoff=addDays(last.date,-90);
  let first=list.find(f=>f.date>=cutoff);if(!first||first===last)first=list[list.length-2];
  const days=Math.max(1,daysBetween(first.date,last.date));const km=last.odometer-first.odometer;
  return km>0?km/days:null;
}
function serviceForecast(){
  const fs=S.meta.fuel||{};const list=fuelLive();if(!list.length||fs.lastServiceKm==null)return null;
  const odo=list[list.length-1].odometer;const interval=fs.intervalKm||15000;const next=fs.lastServiceKm+interval;const remaining=next-odo;
  const pace=drivingPace();const days=pace&&remaining>0?Math.round(remaining/pace):null;
  return {next,remaining,pace,days,date:days!=null?addDays(todayStr(),days):null,progress:Math.min(1,Math.max(0,(odo-fs.lastServiceKm)/interval)),odo};
}
function viewFuel(){
  const fs=S.meta.fuel||{};const list=fuelLive();const mk=S.month;
  const setup=`<div class="actions"><button class="btn primary" data-act="fuel-add" ${S.accounts.length?'':'disabled'}>Log fill-up</button><button class="btn" data-act="fuel-settings">Vehicle and service</button></div>`;
  if(!list.length)return `<div class="section"><h3>Fuel</h3><p class="note">Log each fill-up with the odometer reading, litres and cost. Ledger then works out how far you drive, what fuel costs you per month and per kilometre, your consumption, and when the next ${fmtKm(fs.intervalKm||15000)} service is due. Each fill-up is also a transaction in the Fuel category.${S.accounts.length?'':' Add an account first.'}</p>${setup}</div>`;
  const svc=serviceForecast();const last=list[list.length-1];
  let hero;
  if(svc){
    const cls=svc.remaining<0?'over':svc.remaining<1500?'warn':'';
    hero=`<section class="hero"><h1>${svc.remaining<0?`Service overdue by <span class="num">${fmtKm(-svc.remaining)}</span>`:`Service in <span class="num">${fmtKm(svc.remaining)}</span>`}</h1><div class="track"><div class="fill ${cls}" style="width:${(svc.progress*100).toFixed(1)}%"></div></div><p>${fs.vehicle?esc(fs.vehicle)+': ':''}next service at ${fmtKm(svc.next)}; odometer ${fmtKm(svc.odo)} on ${dateLabel(last.date)}.${svc.date&&svc.remaining>0?` At about ${Math.round(svc.pace)} km a day, expect it around ${longDate(svc.date)}.`:svc.remaining>0?' Log a few more fill-ups to get a date.':''}</p></section>`;
  }else hero=`<section class="hero"><h1>Odometer <span class="num">${fmtKm(last.odometer)}</span></h1><p>Enter your last service reading under Vehicle and service to get a forecast for the next one.</p></section>`;
  const now=fuelStats(mk),prev=fuelStats(shiftMonth(mk,-1));const cons=consumption();
  const d=(a,b)=>{if(!b||!a)return '';const diff=a-b;if(!diff)return '';const up=diff>0;return `<div class="d ${up?'up':'down'}">${up?'▲':'▼'} ${Math.round(Math.abs(diff)/b*100)}% vs ${monthShort(shiftMonth(mk,-1))}</div>`;};
  const tiles=`<div class="tiles">
    <div class="tile"><div class="v">${fmtShort(now.cost)}</div><div class="l">Fuel spend, ${monthShort(mk)}</div>${d(now.cost,prev.cost)}</div>
    <div class="tile"><div class="v">${fmtKm(now.km)}</div><div class="l">Driven, ${monthShort(mk)}</div>${d(now.km,prev.km)}</div>
    <div class="tile"><div class="v">${now.ppl?fmt(now.ppl)+'/L':'—'}</div><div class="l">Average price paid</div>${d(now.ppl,prev.ppl)}</div>
    <div class="tile"><div class="v">${cons?fmtNum(cons,1)+' L/100km':'—'}</div><div class="l">Consumption${now.costPerKm?`, ${fmt(now.costPerKm)}/km`:''}</div></div></div>`;
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(mk,-i));
  const stats=months.map(m=>({m,...fuelStats(m)}));
  const table=`<div class="section"><h3>Month by month</h3>${sixMonthBars(mk,m=>({value:fuelStats(m).cost}),colorOf(fuelCatId()))}<table class="cmp"><thead><tr><th>Month</th><th>km</th><th>Litres</th><th>R/L</th><th>Spend</th></tr></thead><tbody>${stats.filter(s=>s.n).map(s=>`<tr><td>${monthShort(s.m)}</td><td>${Math.round(s.km).toLocaleString('en-ZA')}</td><td>${fmtNum(s.litres,1)}</td><td>${s.ppl?fmtNum(s.ppl/100,2):'—'}</td><td>${fmtShort(s.cost)}</td></tr>`).join('')}</tbody></table></div>`;
  const rows=[...list].reverse().slice(0,40).map(f=>{const idx=list.indexOf(f);const prevF=idx>0?list[idx-1]:null;const km=prevF?f.odometer-prevF.odometer:null;return `<button class="item" data-act="fuel-edit" data-id="${f.id}"><span>${esc(f.station||'Fill-up')}<span class="sub">${dateLabel(f.date)}, ${fmtKm(f.odometer)}${km!=null?` (+${Math.round(km)} km)`:''}, ${fmtNum(f.litres,1)} L at ${fmtNum(f.pricePerL/100,2)}${f.full?'':', partial'}</span></span><span class="amt">${fmt(f.cost)}</span></button>`;}).join('');
  return `${hero}${tiles}${setup}${table}<div class="section"><h3>Fill-ups</h3>${rows}</div>`;
}
function openFuelSheet(id){
  if(!S.accounts.length){toast('Add an account first');openAccountSheet();return;}
  const ex=id?S.fuel.find(f=>f.id===id):null;const list=fuelLive();const lastOdo=list.length?list[list.length-1].odometer:null;
  const stations=[...new Set(S.fuel.map(f=>f.station).filter(Boolean))];
  const defAcc=ex?(S.transactions.find(t=>t.id===ex.transactionId)?.accountId||S.meta.lastAccountId):(accById(S.meta.lastAccountId)?S.meta.lastAccountId:S.accounts[0].id);
  const html=`<div class="row2"><div class="field"><label for="fuDate">Date</label><input id="fuDate" type="date" value="${ex?.date||todayStr()}"></div><div class="field"><label for="fuOdo">Odometer (km)</label><input id="fuOdo" inputmode="numeric" placeholder="${lastOdo?lastOdo:'e.g. 84250'}" value="${ex?ex.odometer:''}"></div></div>

    <p class="note">Fill in any two of litres, total and price per litre; the third is worked out. Consumption is measured between full tanks.</p>`;
  openSheet(ex?'Edit fill-up':'Log fill-up',html,`${ex?`<button class="btn danger" id="fuDel">Delete</button>`:''}<button class="btn primary" id="fuSave">${ex?'Save changes':'Log fill-up'}</button>`);
  const L=()=>parseNum($('#fuL').value),C=()=>parseAmountInput($('#fuCost').value),P=()=>parseAmountInput($('#fuP').value);

  $('#fuL').oninput=()=>{const l=L();if(!l)return;if(C())show($('#fuP'),Math.round(C()/l));else if(P())show($('#fuCost'),Math.round(P()*l));};
  $('#fuCost').oninput=()=>{const l=L();if(l&&C())show($('#fuP'),Math.round(C()/l));};
  $('#fuP').oninput=()=>{const l=L();if(l&&P())show($('#fuCost'),Math.round(P()*l));};
  $('#fuSave').onclick=async()=>{
    const odo=parseNum($('#fuOdo').value),litres=L();let cost=C(),price=P();

    if(!litres||litres<=0){toast('Enter the litres');$('#fuL').focus();return;}
    if(!cost&&price)cost=Math.round(price*litres);

    const date=$('#fuDate').value||todayStr(),station=$('#fuSt').value.trim(),accountId=$('#fuAcc').value,note=$('#fuNote').value.trim(),now=nowISO();
    const f=Object.assign(ex||{id:uid(),createdAt:now},{date,odometer:Math.round(odo),litres:Math.round(litres*100)/100,cost,pricePerL:price,station,full:$('#fuFull').checked,note,updatedAt:now});
    let t=ex?S.transactions.find(x=>x.id===ex.transactionId):null;
    if(!t){t={id:uid(),createdAt:now,source:'manual',reviewed:true,note:''};f.transactionId=t.id;}

  };
}

/* ================= transaction sheet ================= */
function openTxnSheet(id,pre){
  const ex=id?S.transactions.find(t=>t.id===id):null;
  if(ex&&ex.fuelId&&S.fuel.find(f=>f.id===ex.fuelId&&!f.deletedAt)){openFuelSheet(ex.fuelId);return;}
  pre=pre||{};
  let kind=ex?(ex.transferId?'transfer':ex.amount>0?'income':'expense'):(pre.kind||'expense');
  const counterpart=ex&&ex.transferId?S.transactions.find(t=>t.transferId===ex.transferId&&t.id!==ex.id&&!t.deletedAt):null;
  const defaultAcc=ex?ex.accountId:(pre.accountId||(accById(S.meta.lastAccountId)?S.meta.lastAccountId:S.accounts[0]?.id));
  let fromId=defaultAcc,toId=S.accounts.find(a=>a.id!==defaultAcc)?.id||defaultAcc;
  if(ex&&counterpart){if(ex.amount<0){fromId=ex.accountId;toId=counterpart.accountId;}else{fromId=counterpart.accountId;toId=ex.accountId;}}
  const amt=ex?(Math.abs(ex.amount)/100).toFixed(2).replace('.',','):(pre.amount?(pre.amount/100).toFixed(2).replace('.',','):'');
  const src=ex?.source||(pre.smsKey?'sms':'');
  const html=`
    <div class="seg" id="kind">${['expense','income','transfer'].map(k=>`<button type="button" data-k="${k}" class="${k===kind?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
    <div class="field"><label for="fAmt">Amount</label><input id="fAmt" class="big" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${amt}"></div>
    <div class="field" data-kind="expense income"><label for="fPayee">Payee</label><input id="fPayee" list="payees" autocomplete="off" placeholder="Where or who" value="${esc(ex?.payee??pre.payee??'')}"><datalist id="payees">${payeeOptions()}</datalist></div>
    <div class="field" data-kind="expense income"><label for="fCat">Category</label><select id="fCat">${catOptions(kind==='income'?'income':'expense',ex?.categoryId||pre.categoryId)}</select></div>
    <div class="field" data-kind="expense income"><label for="fAcc">Account</label><select id="fAcc">${accOptions(defaultAcc)}</select></div>
    <div class="row2" data-kind="transfer"><div class="field"><label for="fFrom">From</label><select id="fFrom">${accOptions(fromId)}</select></div><div class="field"><label for="fTo">To</label><select id="fTo">${accOptions(toId)}</select></div></div>
    <div class="row2"><div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="${ex?.date||pre.date||todayStr()}"></div><div class="field"><label for="fNote">Note</label><input id="fNote" autocomplete="off" placeholder="Optional" value="${esc(ex?.note||'')}"></div></div>
    ${(src==='import'||src==='sms')?`<div class="field">${ex?`<label class="chk"><input type="checkbox" id="fRev" ${ex.reviewed?'checked':''}>Reviewed</label>`:''}${(ex?.bankDescription||pre.smsText)?`<span class="note">${src==='sms'?'From the SMS':'On the statement'}: ${esc(ex?.bankDescription||pre.smsText)}</span>`:''}</div>`:''}`;
  const foot=`${ex?`<button class="btn danger" id="fDel">Delete</button>`:''}<button class="btn primary" id="fSave">${ex?'Save changes':'Add'}</button>`;
  openSheet(ex?'Edit transaction':(pre.smsKey?'Add from SMS':'Add transaction'),html,foot);
  const sheet=$('#sheet');
  const setKind=k=>{
    kind=k;
    $$('#kind button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
    $$('[data-kind]',sheet).forEach(el=>{el.hidden=!el.dataset.kind.split(' ').includes(k);});
    if(k!=='transfer'){const cur=$('#fCat').value;$('#fCat').innerHTML=catOptions(k,cur);}
  };
  setKind(kind);
  $$('#kind button').forEach(b=>b.onclick=()=>setKind(b.dataset.k));
  let catTouched=!!ex||!!pre.categoryId;
  $('#fCat').onchange=()=>{catTouched=true;};
  $('#fPayee').oninput=()=>{
    if(catTouched)return;
    const sel=$('#fCat');const has=id=>id&&Array.from(sel.options).some(o=>o.value===id);
    const r=applyRules($('#fPayee').value);
    if(has(r.categoryId)){sel.value=r.categoryId;return;}
    const last=lastCategoryForPayee($('#fPayee').value);
    if(has(last))sel.value=last;
  };
  $('#fSave').onclick=()=>saveTxnForm(ex,counterpart,()=>kind,pre);
  if(ex)$('#fDel').onclick=()=>deleteTxn(ex.id);
  if(!ex&&!pre.amount)setTimeout(()=>$('#fAmt')?.focus(),60);
}
async function saveTxnForm(ex,counterpart,getKind,pre){
  const kind=getKind();const cents=parseAmountInput($('#fAmt').value);
  if(cents==null||cents<=0){toast('Enter an amount');$('#fAmt').focus();return;}
  const date=$('#fDate').value||todayStr();const note=$('#fNote').value.trim();const now=nowISO();
  if(kind==='transfer'){
    const from=$('#fFrom').value,to=$('#fTo').value;
    if(!from||!to||from===to){toast('Choose two different accounts');return;}
    const transferId=ex?.transferId||uid();
    const outEx=ex?(ex.amount<0?ex:counterpart):null,inEx=ex?(ex.amount<0?counterpart:ex):null;
    const a=Object.assign(outEx||{id:uid(),createdAt:now,source:'manual',reviewed:true},{accountId:from,date,amount:-cents,payee:'To '+(accById(to)?.name||''),categoryId:'cat_transfer',note,transferId,updatedAt:now});
    const b=Object.assign(inEx||{id:uid(),createdAt:now,source:'manual',reviewed:true},{accountId:to,date,amount:cents,payee:'From '+(accById(from)?.name||''),categoryId:'cat_transfer',note,transferId,updatedAt:now});
    await upsertTxns([a,b]);
  }else{
    const payee=$('#fPayee').value.trim();const categoryId=$('#fCat').value||'cat_uncat';const accountId=$('#fAcc').value;
    if(!accountId){toast('Add an account first');return;}
    const base=ex||{id:uid(),createdAt:now,source:pre&&pre.smsKey?'sms':'manual',reviewed:!(pre&&pre.smsKey)};
    if(pre&&pre.smsKey&&!ex){base.smsKey=pre.smsKey;base.bankDescription=(pre.smsText||'').slice(0,300);}
    const t=Object.assign(base,{accountId,date,amount:kind==='expense'?-cents:cents,payee,categoryId,note,updatedAt:now});
    if(t.transferId){delete t.transferId;if(counterpart){counterpart.deletedAt=now;await upsertTxns([counterpart]);}}
    const rev=$('#fRev');if(rev)t.reviewed=rev.checked;
    await upsertTxns([t]);await setMeta('lastAccountId',accountId);
  }
  closeSheet();toast(ex?'Saved':'Added');
  if(!ex)S.month=date.slice(0,7);
  render();
}
async function deleteTxn(id){
  const t=S.transactions.find(x=>x.id===id);if(!t)return;
  const now=nowISO();const list=[t];
  if(t.transferId){const c=S.transactions.find(x=>x.transferId===t.transferId&&x.id!==t.id&&!x.deletedAt);if(c)list.push(c);}
  for(const x of list)x.deletedAt=now;
  const f=t.fuelId?S.fuel.find(x=>x.id===t.fuelId):null;if(f){f.deletedAt=now;await upsert('fuel','fuel',f);}
  await upsertTxns(list);closeSheet();render();
  toast('Deleted',{action:'Undo',onAction:async()=>{for(const x of list)delete x.deletedAt;await upsertTxns(list);if(f){delete f.deletedAt;await upsert('fuel','fuel',f);}render();}});
}

  if(!ex)setTimeout(()=>$('#aName')?.focus(),60);

/* ================= bank SMS ================= */
const BANKS=[['fnb','FNB'],['capitec','Capitec'],['std bank','Standard Bank'],['standard bank','Standard Bank'],['nedbank','Nedbank'],['absa','Absa'],['discovery','Discovery'],['tyme','TymeBank'],['investec','Investec'],['african bank','African Bank']];
function parseBankSMS(text){
  const t=String(text||'').replace(/\s+/g,' ').trim();if(!t)return null;
  let amount=null;
  for(const m of t.matchAll(/R\s?(\d[\d ,]*(?:[.,]\d{2})?)/gi)){
    const pre=t.slice(Math.max(0,m.index-16),m.index).toLowerCase();
    if(/avail|bal|limit|remaining/.test(pre))continue;
    const v=parseAmount(m[1].replace(/[ ,.]+$/,''));if(v){amount=Math.abs(v);break;}
  }
  if(!amount)return null;
  const low=t.toLowerCase();
  const incomeKw=/\b(received|deposit(ed)?|credited|credit of|paid into|salary|refund(ed)?|reversal|money in|transfer in)\b/;
  const expenseKw=/\b(paid|purchase|reserved|debit(ed)?|withdraw(al|n)?|spent|payment|sent|transfer out|swiped|pos|bought|cash out|fee)\b/;
  let kind=null;
  if(incomeKw.test(low)&&!/\b(paid to|payment to|paid for|you paid)\b/.test(low))kind='income';
  else if(expenseKw.test(low))kind='expense';
  const stop='(?=\\s+(?:from|on\\b|using|with|via|into|to\\b|card|a/c|acc\\b|account|ref|avail|bal|at\\b|for\\b|\\d{1,2}[A-Za-z]{3})|\\s*[.,;]|$)';
  const pats=kind==='income'
    ?[new RegExp('\\b(?:from|by)\\s+(.+?)'+stop,'i')]
    :[new RegExp('(?:@|\\bat)\\s+(.+?)'+stop,'i'),new RegExp('\\b(?:to|for)\\s+(.+?)'+stop,'i'),new RegExp('\\bfrom\\s+(.+?)'+stop,'i')];
  let payee=null;
  for(const re of pats){
    const m=t.match(re);if(!m)continue;
    let p=m[1].replace(/\b(purchase|reserved|payment|your)\b/gi,'').replace(/[\s,.;:-]+$/,'').replace(/^\s*(the|your)\s+/i,'').trim();
    if(/^R?\s?\d/.test(p)||p.length<2)continue;
    if(/[a-z]/i.test(p)&&p===p.toUpperCase())p=titleCase(p);
    payee=p.slice(0,40);break;
  }
  let last4=null;
  const acc=t.match(/(?:a\/c|acc(?:ount)?|card)\s*(?:no\.?|number)?\s*[.*x#:]*\s*(\d{4,})/i)||t.match(/[.*x#]{2,}\s?(\d{4})\b/);
  if(acc)last4=acc[1].slice(-4);
  let bank=null;for(const [k,v] of BANKS){if(low.includes(k)){bank=v;break;}}
  let date=null;const today=todayStr();
  const dm=t.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if(dm)date=parseDate(dm[0],'dmy');
  if(!date){
    for(const m of t.matchAll(/\b(\d{1,2})\s?([A-Za-z]{3})[A-Za-z]*\b/g)){
      const mon=MONTHS[m[2].toLowerCase()];if(!mon)continue;
      const d=Number(m[1]);if(d<1||d>31)continue;
      let y=Number(today.slice(0,4));if(y+'-'+pad(mon)+'-'+pad(d)>today)y--;
      date=y+'-'+pad(mon)+'-'+pad(d);break;
    }
  }
  if(!date||date>today||daysBetween(date,today)>60)date=today;
  return {amount,kind:kind||'expense',payee,last4,bank,date,confident:!!kind&&!!payee};
}
function resolveAccount(p){
  if(p.last4){const a=S.accounts.find(a=>a.last4&&a.last4===p.last4);if(a)return a.id;}
  if(p.bank){const key=p.bank.toLowerCase().split(' ')[0];const m=S.accounts.filter(a=>a.name.toLowerCase().includes(key));if(m.length===1)return m[0].id;}
  if(S.accounts.length===1)return S.accounts[0].id;
  return accById(S.meta.lastAccountId)?S.meta.lastAccountId:S.accounts[0]?.id;
}
async function handleSMS(text,opts={}){
  if(!S.accounts.length){toast('Add an account first');openAccountSheet();return null;}
  const p=parseBankSMS(text);
  if(!p){toast("Couldn't find an amount in that message");if(!opts.silent)openSMSSheet(text);return null;}
  const key=normText(text).slice(0,200);
  const dup=S.transactions.find(t=>t.smsKey===key&&Math.abs(daysBetween(t.date,p.date))<=3);
  if(dup){toast('Already added from this message');return dup;}
  const accountId=resolveAccount(p);
  const r=applyRules((p.payee||'')+' '+text);const payee=r.payee||p.payee||'';
  const categoryId=r.categoryId&&catById(r.categoryId)?r.categoryId:(lastCategoryForPayee(payee)||'cat_uncat');
  const auto=(opts.auto??(S.meta.smsAuto!==false))&&p.confident&&accountId;
  if(auto){
    const t={id:uid(),accountId,date:p.date,amount:p.kind==='income'?p.amount:-p.amount,payee,categoryId,note:'',source:'sms',reviewed:false,bankDescription:text.slice(0,300),smsKey:key,createdAt:nowISO(),updatedAt:nowISO()};
    await upsertTxns([t]);closeSheet();S.month=p.date.slice(0,7);render();
    toast(`Added ${fmt(Math.abs(t.amount))}${payee?' at '+payee:''}${categoryId==='cat_uncat'?', uncategorised':''}`,{action:'Undo',onAction:async()=>{t.deletedAt=nowISO();await upsertTxns([t]);render();}});
    return t;

/* ================= CSV import ================= */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const sample=text.split(/\r?\n/).slice(0,25).join('\n');
  const counts=[[',',(sample.match(/,/g)||[]).length],[';',(sample.match(/;/g)||[]).length],['\t',(sample.match(/\t/g)||[]).length]];
  const delim=counts.sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c;}
    else if(c==='"')inQ=true;
    else if(c===delim){row.push(field);field='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(f=>f.trim()!==''))rows.push(row);row=[];field='';}
    else field+=c;
  }
  if(field!==''||row.length){row.push(field);if(row.some(f=>f.trim()!==''))rows.push(row);}
  return rows.map(r=>r.map(f=>f.trim()));
}
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(s,order){
  s=String(s||'').trim();let y,m,d,mm;
  if((mm=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+mm[1];m=+mm[2];d=+mm[3];}
  else if((mm=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})\b/))){const a=+mm[1],b=+mm[2];y=+mm[3];if(y<100)y+=2000;if(order==='mdy'){m=a;d=b;}else{d=a;m=b;}}
  else if((mm=s.match(/^(\d{1,2})[\s\-]+([A-Za-z]{3,})\.?[\s\-]+(\d{4}|\d{2})\b/))){d=+mm[1];m=MONTHS[mm[2].slice(0,3).toLowerCase()];y=+mm[3];if(y<100)y+=2000;}
  else if((mm=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/))){m=MONTHS[mm[1].slice(0,3).toLowerCase()];d=+mm[2];y=+mm[3];}
  else if((mm=s.match(/^(\d{4})(\d{2})(\d{2})$/))){y=+mm[1];m=+mm[2];d=+mm[3];}
  if(!y||!m||!d||m<1||m>12||d<1||d>31)return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseAmount(s){
  if(s==null)return null;s=String(s).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(/^-/.test(s)){neg=true;s=s.slice(1);}
  if(/-\s*$/.test(s)){neg=true;s=s.replace(/-\s*$/,'');}
  if(/\bDR\b/i.test(s))neg=true;
  s=s.replace(/[^\d.,]/g,'');if(!s)return null;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');let norm;
  if(lc>-1&&ld>-1)norm=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(lc>-1){const p=s.split(',');norm=(p.length===2&&p[1].length<=2)?p[0]+'.'+p[1]:p.join('');}
  else norm=s;
  const n=Number(norm);if(!isFinite(n))return null;
  return Math.round(n*100)*(neg?-1:1);
}
function looksLikeDate(s){return parseDate(s,'dmy')!==null;}
function detectTable(rows){
  const counts={};for(const r of rows)counts[r.length]=(counts[r.length]||0)+1;
  const modal=Number(Object.entries(counts).sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0]?.[0]||0);
  const idx=rows.findIndex(r=>r.length===modal&&r.some(f=>/[A-Za-z]/.test(f))&&!r.some(f=>looksLikeDate(f)));
  const header=idx>=0?rows[idx]:Array.from({length:modal},(_,i)=>'Column '+(i+1));
  const data=rows.filter((r,i)=>r.length===modal&&i>idx);
  return {header,data,headerRow:idx};
}
function guessMapping(header,saved){
  const key=header.join('|');
  if(saved&&saved.headerKey===key)return {...saved};
  const find=re=>{const i=header.findIndex(h=>re.test(h));return i>=0?String(i):'';};
  const m={headerKey:key,date:find(/date/i),desc:find(/desc|narr|detail|memo|particular|transaction/i),desc2:find(/^ref|reference/i),balance:find(/balance/i),dateOrder:'dmy',invert:false};
  const debit=find(/debit|withdraw|money out|out$/i),credit=find(/credit|deposit|money in|in$/i);
  const amount=find(/^amount|amount$|^amt/i);
  if(debit&&credit&&!amount){m.mode='split';m.debit=debit;m.credit=credit;m.amount='';}
  else{m.mode='single';m.amount=amount||find(/amount/i);m.debit=debit;m.credit=credit;}
  if(!m.desc){const i=header.findIndex((h,i)=>String(i)!==m.date&&String(i)!==m.amount&&String(i)!==m.balance);m.desc=i>=0?String(i):'';}
  if(m.desc2===m.desc)m.desc2='';
  return m;
}
function parseImportRows(){
  const m=IMP.mapping,items=[];let errors=0;
  for(const r of IMP.rows){
    const date=m.date!==''?parseDate(r[+m.date],m.dateOrder):null;
    const desc=[m.desc!==''?r[+m.desc]:'',m.desc2!==''?r[+m.desc2]:''].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    let amount=null;
    if(m.mode==='split'){const d=m.debit!==''?parseAmount(r[+m.debit]):null,c=m.credit!==''?parseAmount(r[+m.credit]):null;if(d!=null||c!=null)amount=Math.abs(c||0)-Math.abs(d||0);}
    else if(m.amount!==''){amount=parseAmount(r[+m.amount]);if(amount!=null&&m.invert)amount=-amount;}
    const balance=m.balance!==''?parseAmount(r[+m.balance]):null;
    if(!date||amount==null){errors++;items.push({error:true,raw:r,date,desc,amount});continue;}
    items.push({date,desc,amount,balance,raw:r});
  }
  const seen={};
  for(const it of items){if(it.error)continue;const base=[IMP.accountId,it.date,it.amount,normText(it.desc),it.balance==null?'':it.balance].join('|');seen[base]=(seen[base]||0)+1;it.fingerprint=base+'|'+seen[base];}
  const existing=new Set(S.transactions.filter(t=>t.fingerprint).map(t=>t.fingerprint));
  const manual=live().filter(t=>t.accountId===IMP.accountId&&t.source!=='import'&&!t.fingerprint&&!isTransfer(t));
  const taken=new Set();
  for(const it of items){
    if(it.error)continue;
    if(existing.has(it.fingerprint)){it.status='skip';continue;}
    const cands=manual.filter(t=>!taken.has(t.id)&&t.amount===it.amount&&Math.abs(daysBetween(t.date,it.date))<=3).sort((a,b)=>Math.abs(daysBetween(a.date,it.date))-Math.abs(daysBetween(b.date,it.date)));
    if(cands.length){it.status='match';it.matchId=cands[0].id;taken.add(cands[0].id);}
    else it.status='new';
  }
  return {items,errors};
}
function openImporter(){
  if(!S.accounts.length){toast('Add an account first');return;}
  IMP={accountId:accById(S.meta.lastImportAccount)?S.meta.lastImportAccount:S.accounts[0].id,rows:null,mapping:null,fileName:''};
  const html=`<div class="field"><label for="impAcc">Statement is for</label><select id="impAcc">${accOptions(IMP.accountId)}</select></div>
    <div class="field"><label for="impFile">Statement file (CSV from your bank)</label><input id="impFile" type="file" accept=".csv,.txt,text/csv,text/plain"></div>
    <div id="impMap"></div>`;

  $('#impAcc').onchange=()=>{IMP.accountId=$('#impAcc').value;if(IMP.rows){IMP.mapping=guessMapping(IMP.header,S.meta['mapping:'+IMP.accountId]);renderMapping();}};

function loadImportText(text){

  if(rows.length<2){$('#impMap').innerHTML='<p class="note bad">That file has no rows to import.</p>';return;}
  const {header,data}=detectTable(rows);

function renderMapping(){
  const m=IMP.mapping,h=IMP.header;
  const colSel=(id,val)=>`<select data-map="${id}"><option value="">—</option>${h.map((c,i)=>`<option value="${i}" ${String(i)===String(val)?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  $('#impMap').innerHTML=`<p class="note">${IMP.rows.length} rows found. Check the columns below match your bank's file.</p>
    <div class="row2"><div class="field"><label>Date</label>${colSel('date',m.date)}</div><div class="field"><label>Day and month order</label><select data-map="dateOrder"><option value="dmy" ${m.dateOrder==='dmy'?'selected':''}>Day first (06/09/2026)</option><option value="mdy" ${m.dateOrder==='mdy'?'selected':''}>Month first (09/06/2026)</option></select></div></div>
    <div class="row2"><div class="field"><label>Description</label>${colSel('desc',m.desc)}</div><div class="field"><label>Also include</label>${colSel('desc2',m.desc2)}</div></div>
    <div class="field"><label>Amounts are in</label><select data-map="mode"><option value="single" ${m.mode==='single'?'selected':''}>One column, minus for money out</option><option value="split" ${m.mode==='split'?'selected':''}>Two columns: money out and money in</option></select></div>
    <div class="row2" id="mapSingle" ${m.mode==='single'?'':'hidden'}><div class="field"><label>Amount</label>${colSel('amount',m.amount)}</div><div class="field"><label>Sign</label><select data-map="invert"><option value="" ${!m.invert?'selected':''}>Minus is money out</option><option value="1" ${m.invert?'selected':''}>Minus is money in (flip)</option></select></div></div>
    <div class="row2" id="mapSplit" ${m.mode==='split'?'':'hidden'}><div class="field"><label>Money out</label>${colSel('debit',m.debit)}</div><div class="field"><label>Money in</label>${colSel('credit',m.credit)}</div></div>
    <div class="field"><label>Balance after each row (optional, improves matching)</label>${colSel('balance',m.balance)}</div>
    <div id="impPrev"></div>`;
  $$('[data-map]').forEach(sel=>sel.onchange=()=>{
    const k=sel.dataset.map;m[k]=k==='invert'?!!sel.value:sel.value;
    if(k==='mode'){$('#mapSingle').hidden=m.mode!=='single';$('#mapSplit').hidden=m.mode!=='split';}
    renderPreview();
  });
  renderPreview();
}
function renderPreview(){
  const {items,errors}=parseImportRows();
  IMP.parsed=items;
  const c={new:0,match:0,skip:0};for(const it of items)if(!it.error)c[it.status]++;
  const rows=items.slice(0,8).map(it=>it.error?`<tr class="bad"><td colspan="3">Couldn't read: ${esc(it.raw.join(' | ').slice(0,80))}</td></tr>`:`<tr><td>${it.date.slice(5)}</td><td>${esc(it.desc.slice(0,44))}<br><small style="color:var(--ink-3)">${it.status==='new'?'New':it.status==='match'?'Matches an entry you already have':'Already imported'}</small></td><td class="amt ${it.amount>0?'in':''}">${fmt(it.amount)}</td></tr>`).join('');
  $('#impPrev').innerHTML=`<div class="counts"><span>New<b>${c.new}</b></span><span>Match existing<b>${c.match}</b></span><span>Already imported<b>${c.skip}</b></span><span>Unreadable<b class="${errors?'bad':''}">${errors}</b></span></div>
    <table class="prev"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead><tbody>${rows}</tbody></table>${items.length>8?`<p class="note">Showing 8 of ${items.length}.</p>`:''}`;
  const go=$('#impGo');go.disabled=!(c.new+c.match);go.textContent=c.new+c.match?`Import ${c.new+c.match}`:'Nothing new to import';
}
async function runImport(){
  if(!IMP||!IMP.parsed)return;
  const now=nowISO();const batch={id:uid(),accountId:IMP.accountId,fileName:IMP.fileName,createdAt:now,created:0,matched:0,skipped:0};
  const upserts=[];let latest='';
  for(const it of IMP.parsed){
    if(it.error)continue;
    if(it.status==='skip'){batch.skipped++;continue;}
    if(it.date>latest)latest=it.date;
    if(it.status==='match'){const t=S.transactions.find(x=>x.id===it.matchId);Object.assign(t,{fingerprint:it.fingerprint,importBatchId:batch.id,bankDescription:it.desc,matchedAt:now,reviewed:true,updatedAt:now});upserts.push(t);batch.matched++;continue;}
    const r=applyRules(it.desc);
    const payee=r.payee||cleanPayee(it.desc);
    upserts.push({id:uid(),accountId:IMP.accountId,date:it.date,amount:it.amount,payee,bankDescription:it.desc,categoryId:r.categoryId&&catById(r.categoryId)?r.categoryId:(lastCategoryForPayee(payee)||'cat_uncat'),note:'',source:'import',reviewed:false,fingerprint:it.fingerprint,importBatchId:batch.id,createdAt:now,updatedAt:now});
    batch.created++;
  }
  await upsertTxns(upserts);
  S.batches.push(batch);await dbPut('importBatches',batch);
  await setMeta('mapping:'+IMP.accountId,IMP.mapping);await setMeta('lastImportAccount',IMP.accountId);
  closeSheet();if(latest)S.month=latest.slice(0,7);S.tab='txns';render();
  toast(`Imported ${batch.created} new, matched ${batch.matched}`);
}
async function rollbackImport(id){
  const b=S.batches.find(x=>x.id===id);if(!b)return;
  if(!confirm(`Undo this import? ${b.created} imported transactions will be removed and ${b.matched} matched entries unlinked.`))return;
  const remove=[],unlink=[];
  for(const t of S.transactions){if(t.importBatchId!==id)continue;if(t.source==='import')remove.push(t.id);else{delete t.fingerprint;delete t.importBatchId;delete t.matchedAt;if(t.source!=='sms')delete t.bankDescription;t.updatedAt=nowISO();unlink.push(t);}}
  S.transactions=S.transactions.filter(t=>!remove.includes(t.id));
  await dbDeleteMany('transactions',remove);await upsertTxns(unlink);
  S.batches=S.batches.filter(x=>x.id!==id);await dbDeleteMany('importBatches',[id]);
  render();toast('Import undone');
}

/* ================= recently deleted ================= */
function openDeleted(){
  const list=S.transactions.filter(t=>t.deletedAt).sort((a,b)=>b.deletedAt.localeCompare(a.deletedAt)).slice(0,100);
  const rows=list.map(t=>`<div class="item"><span>${esc(t.payee||catName(t.categoryId))}<span class="sub">${dateLabel(t.date)}, ${esc(accById(t.accountId)?.name||'')}</span></span><span class="amt">${fmt(t.amount)}</span><button class="btn small" data-restore="${t.id}">Restore</button></div>`).join('');
  openSheet('Recently deleted',rows||'<p class="empty">Nothing here.</p>',list.length?`<button class="btn danger" id="dPurge">Delete all permanently</button><button class="btn primary" data-act="close-sheet">Done</button>`:'');
  $$('[data-restore]').forEach(b=>b.onclick=async()=>{const t=S.transactions.find(x=>x.id===b.dataset.restore);delete t.deletedAt;const f=t.fuelId?S.fuel.find(x=>x.id===t.fuelId):null;if(f){delete f.deletedAt;await upsert('fuel','fuel',f);}await upsertTxns([t]);openDeleted();render();toast('Restored');});
  const p=$('#dPurge');if(p)p.onclick=async()=>{if(!confirm(`Permanently delete ${list.length} transaction${list.length===1?'':'s'}? This can't be undone.`))return;const ids=list.map(t=>t.id);S.transactions=S.transactions.filter(t=>!ids.includes(t.id));await dbDeleteMany('transactions',ids);const fids=S.fuel.filter(f=>f.deletedAt).map(f=>f.id);S.fuel=S.fuel.filter(f=>!f.deletedAt);await dbDeleteMany('fuel',fids);closeSheet();render();toast('Deleted permanently');};
}

/* ================= backup ================= */
function backupJSON(){return JSON.stringify({app:'ledger',version:APP_VERSION,exportedAt:nowISO(),accounts:S.accounts,categories:S.categories,transactions:S.transactions,budgets:S.budgets,rules:S.rules,importBatches:S.batches,fuel:S.fuel,meta:S.meta});}
async function exportBackup(){
  const json=backupJSON();const name='ledger-backup-'+todayStr()+'.json';
  let shared=false;
  try{if(typeof File!=='undefined'&&navigator.canShare){const file=new File([json],name,{type:'application/json'});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});shared=true;}}}
  catch(e){if(e&&e.name==='AbortError')return;}
  if(!shared){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);}
  await setMeta('lastBackupAt',nowISO());render();toast('Backup exported');
}
async function restoreBackup(file){
  let data;
  try{data=JSON.parse(await file.text());}catch{toast("That file isn't a Ledger backup");return;}
  await restoreData(data,true);
}
async function restoreData(data,ask){
  if(!data||data.app!=='ledger'||!Array.isArray(data.transactions)){toast("That file isn't a Ledger backup");return false;}
  const n=data.transactions.filter(t=>!t.deletedAt).length;
  if(ask&&!confirm(`Replace everything on this phone with the backup from ${String(data.exportedAt||'').slice(0,10)}? It holds ${n} transactions and ${(data.accounts||[]).length} accounts.`))return false;
  for(const s of STORES)await dbClear(s);
  await dbPutMany('accounts',data.accounts||[]);await dbPutMany('categories',data.categories||[]);await dbPutMany('transactions',data.transactions||[]);
  await dbPutMany('budgets',data.budgets||[]);await dbPutMany('rules',data.rules||[]);await dbPutMany('importBatches',data.importBatches||[]);await dbPutMany('fuel',data.fuel||[]);
  await dbPutMany('meta',Object.entries(data.meta||{}).map(([id,value])=>({id,value})));
  await loadAll();applyTheme();render();toast('Backup restored');return true;
}

/* ================= startup ================= */
async function init(){
  S.month=monthKey(new Date());
  db=await openDB();
  await loadAll();
  applyTheme();
  render();
  try{if(navigator.storage&&navigator.storage.persist)S.persisted=await navigator.storage.persist();}catch{}
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();S.usage=e.usage||0;}}catch{}
  const params=new URLSearchParams(location.search);
  const shared=params.get('sms')||params.get('text')||'';
  if(shared){try{history.replaceState(null,'',location.pathname);}catch{}await handleSMS(shared,{silent:true});}
  if(S.tab==='more')render();
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)toast('A new version is ready',{action:'Reload',duration:20000,onAction:()=>nw.postMessage('SKIP_WAITING')});});});
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
  }
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(S.tab==='more')render();});
window.Ledger={S,fn:{parseCSV,parseDate,parseAmount,detectTable,guessMapping,parseImportRows,runImport,rollbackImport,loadImportText,openImporter,renderPreview,upsertTxns,deleteTxn,setBudget,monthTotals,spentFor,spentTop,spentLeaf,effectiveLimit,projectionFor,insights,accountBalance,backupJSON,restoreData,applyRules,cleanPayee,render,openTxnSheet,saveTxnForm,openAccountSheet,openCategoriesList,openCategorySheet,openCatDetail,setMeta,parseBankSMS,handleSMS,openSMSSheet,openFuelSheet,openFuelSettings,fuelStats,consumption,drivingPace,serviceForecast,fuelCatId,topCats,childrenOf,statusOf,get IMP(){return IMP;},set IMP(v){IMP=v;}}};
window.LedgerReady=init().catch(e=>{console.error(e);$('#view').innerHTML=`<p class="empty bad">Ledger couldn't open its storage: ${esc(e.message||e)}. Try a different browser, or check that private browsing is off.</p>`;});
</script>

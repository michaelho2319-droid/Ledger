<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#EEF2E6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111A14" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ledger</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<style>
:root{
  --paper:#EEF2E6; --paper-2:#E3EAD8; --rule:#CBD6BF; --rule-strong:#A3B497;
  --ink:#14261C; --ink-2:#4A5C50; --ink-3:#78897D;
  --green:#1F7A4D; --red:#B5382C; --amber:#B8781A; --margin:#C94A3D;
  --shadow:0 -8px 30px rgba(20,38,28,.18); --scrim:rgba(20,38,28,.38);
}
[data-theme="dark"]{
  --paper:#111A14; --paper-2:#1A251D; --rule:#27352C; --rule-strong:#3F5346;
  --ink:#E9EFE4; --ink-2:#A9B8AD; --ink-3:#7D8C82;
  --green:#5CCB93; --red:#E8766A; --amber:#E2A93F; --margin:#D9584A;
  --shadow:0 -8px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111A14; --paper-2:#1A251D; --rule:#27352C; --rule-strong:#3F5346;
    --ink:#E9EFE4; --ink-2:#A9B8AD; --ink-3:#7D8C82;
    --green:#5CCB93; --red:#E8766A; --amber:#E2A93F; --margin:#D9584A;
    --shadow:0 -8px 30px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.4;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;touch-action:manipulation}
button,.row,.item,.chip,.crow,.insight,#tabs,#fab,.sh,.heat button{-webkit-user-select:none;user-select:none}
html[data-text="large"] #app,html[data-text="large"] #sheet .panel,html[data-text="large"] #toast,html[data-text="large"] #ask .card{zoom:1.12}
@media (prefers-reduced-motion: no-preference){#sheet .panel{transition:transform .22s cubic-bezier(.2,.8,.2,1)}}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion: no-preference){ .fill,.bar div{transition:width .35s ease} }

#app{max-width:600px;margin:0 auto;min-height:100vh;padding:calc(4px + env(safe-area-inset-top)) 16px calc(150px + env(safe-area-inset-bottom))}
.pagehead{display:flex;align-items:center;justify-content:space-between;padding:12px 0 6px;position:sticky;top:0;background:var(--paper);z-index:5}
.pagehead h2{margin:0;font-size:18px;font-weight:500}
.monthnav{display:flex;align-items:center;gap:6px;padding:6px 0 6px;position:sticky;top:0;background:var(--paper);z-index:5;margin-bottom:8px}
.monthnav .arrow{flex:0 0 48px;width:48px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.monthnav .arrow:active{background:var(--paper-2)}
.monthnav .arrow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.monthnav .mtitle{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:48px;padding:2px 4px;border-radius:10px;white-space:nowrap;overflow:hidden}
.monthnav .mtitle b{font-size:18px;font-weight:500;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.monthnav .mtitle small{font-size:11px;line-height:1.3;color:var(--ink-3);font-weight:400}
.monthnav .mtitle.away small{color:var(--margin);font-weight:500}
.monthnav .mtitle:active{background:var(--paper-2)}

.hero{padding:6px 0 18px;border-bottom:1px solid var(--rule)}
.hero h1{font-size:clamp(23px,7.2vw,30px);line-height:1.1;font-weight:500;margin:0 0 10px;letter-spacing:-.012em}
.hero .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.hero .wrap>div{min-width:0;flex:1}
.hero .ring{flex:0 0 auto}
.hero .legend{margin-top:12px}
.num{font-variant-numeric:tabular-nums}
.track{position:relative;height:6px;background:var(--paper-2);border-radius:3px;margin:8px 0 12px}
.track .fill{height:100%;background:var(--green);border-radius:3px;max-width:100%}
.track .fill.warn{background:var(--amber)}
.track .fill.over{background:var(--red)}
.track .today{position:absolute;top:-5px;width:2px;height:16px;background:var(--margin);border-radius:1px}
.track .proj{position:absolute;top:-2px;width:2px;height:10px;background:var(--amber);border-radius:1px}
.hero p{margin:0;color:var(--ink-2);font-size:14px}
.hero p button{text-decoration:underline}
.hero .actions{margin-top:14px}

.filters{display:flex;gap:8px;padding:12px 0 0;flex-wrap:wrap;align-items:center}
.filters+.filters{padding-top:8px}
.filters .chip{height:44px}
.filters input,.filters select{min-width:0;height:44px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:10px;background:transparent;font-size:16px}
.filters input{flex:1}
.filters select{flex:1 1 40%;min-width:0}

.ledger{position:relative;border-top:1px solid var(--rule)}
.ledger::before{content:'';position:absolute;left:66px;top:0;bottom:0;width:1px;background:var(--margin);opacity:.55}
.row{display:grid;grid-template-columns:58px 1fr auto;gap:0 14px;width:100%;padding:12px 0;min-height:52px;border-bottom:1px solid var(--rule);text-align:left;align-items:center}
.row:active,.item:active,.crow:active,.insight:active,.sh:active{background:var(--paper-2)}
.row .date{font-size:12px;color:var(--ink-3);padding-top:3px;align-self:start;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;line-height:1.25}
.row .date .yr{display:block;font-size:11px;color:var(--ink-3);opacity:.8}
.row .main{min-width:0;display:flex;flex-direction:column;gap:1px}
.row .payee{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta .acc{color:var(--ink-3);margin-left:8px}
.row .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;font-size:16px}
.amt.in{color:var(--green)}
.amt.tr{color:var(--ink-3);font-weight:500}
.dot{display:inline-block;width:7px;height:7px;border-radius:4px;border:1.5px solid var(--amber);margin-right:6px;vertical-align:1px}
.swatch{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:-1px;flex:0 0 auto}
.empty{color:var(--ink-2);padding:30px 8px;text-align:center;line-height:1.5}

#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;min-height:56px;font-size:11.5px;color:var(--ink-3);position:relative}
#tabs button:active{background:var(--paper-2)}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--ink);font-weight:500}
#tabs button.on::after{content:'';position:absolute;left:32%;right:32%;bottom:4px;height:2px;background:var(--margin)}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));height:54px;padding:0 22px 0 18px;border-radius:27px;background:var(--ink);color:var(--paper);font-weight:600;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:21;display:flex;align-items:center;gap:6px}
#fab:active{transform:scale(.97)}
#fab span{font-size:24px;line-height:1;font-weight:400}

#sheet{position:fixed;inset:0;z-index:30;background:var(--scrim)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--paper);border-radius:18px 18px 0 0;box-shadow:var(--shadow);max-width:560px;margin:0 auto}
#sheet .panel::before{content:'';display:block;width:40px;height:5px;border-radius:3px;background:var(--rule-strong);margin:10px auto 0}
#sheet .head{touch-action:none}
#sheet .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 18px 6px;flex:0 0 auto}
#sheet .head h3{margin:0;font-size:19px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .head button{color:var(--ink-2);height:44px;padding:0 10px;flex:0 0 auto}
#sheet .body{overflow:auto;padding:4px 18px 14px;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
#sheet .foot{display:flex;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--rule);flex:0 0 auto}
#sheet .foot:empty{display:none}
body.sheet-open{overflow:hidden}

.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.field label{font-size:13px;color:var(--ink-2)}
.field label.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)}
.field input,.field select,.field textarea{height:48px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:10px;background:transparent;width:100%;min-width:0;font-size:16px}
.field textarea{height:auto;min-height:96px;padding:10px 12px;line-height:1.4}
.field input[type="checkbox"]{width:20px;height:20px;accent-color:var(--green)}
.field input[type="file"]{padding:9px 12px}
.field input.big{height:66px;font-size:34px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.calc{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin:12px 0 4px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;background:var(--paper-2)}
.calc .cl{font-size:13px;color:var(--ink-2)}
.calc .cv{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.calc .cw{font-size:12.5px;color:var(--ink-3);flex-basis:100%;margin-top:2px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden;margin:6px 0 4px}
.seg button{padding:12px 0;min-height:46px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.btn{height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--rule-strong);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{background:var(--paper-2)}
.btn.primary:active{opacity:.85;background:var(--ink)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);flex:1}
.btn.danger{color:var(--red);border-color:transparent}
.btn.primary.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{height:40px;padding:0 14px;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.note{font-size:13px;color:var(--ink-2);margin:6px 0 10px;line-height:1.45}
.warn{color:var(--amber)}
.bad{color:var(--red)}
.good{color:var(--green)}
.colors{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.colors button{width:40px;height:40px;border-radius:20px;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}

.section{margin:26px 0 0}
.section h3{margin:0 0 8px;font-size:17px;font-weight:600;line-height:1.3}
.section h3 small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:8px;display:inline-block}
.sh{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;gap:10px}
.sh h3{margin:0 0 8px}
.chev{width:9px;height:9px;border-right:1.5px solid var(--ink-3);border-bottom:1.5px solid var(--ink-3);transform:rotate(-45deg);margin:0 6px 8px 0;flex:0 0 auto}
.chev.open{transform:rotate(45deg)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 4px}
.heat .hd{font-size:11px;color:var(--ink-3);text-align:center;padding-bottom:2px}
.heat button{aspect-ratio:1;border-radius:7px;font-size:12.5px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;background:var(--paper-2);color:var(--ink-2)}
.heat button.l1{background:color-mix(in srgb,var(--green) 22%,var(--paper-2))}
.heat button.l2{background:color-mix(in srgb,var(--green) 45%,var(--paper-2));color:var(--ink)}
.heat button.l3{background:color-mix(in srgb,var(--green) 72%,var(--paper-2));color:var(--paper)}
.heat button.l4{background:var(--green);color:var(--paper);font-weight:600}
.heat button.today{outline:2px solid var(--margin);outline-offset:-2px}
.heat button.future{opacity:.35}
.chips.small .chip{padding:0 12px;font-size:13px;min-height:38px}
.totals{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;padding:4px 0 2px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.insight{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.45;width:100%;text-align:left}
.insight i{flex:0 0 4px;border-radius:2px;background:var(--ink-3);align-self:stretch}
.insight.red i{background:var(--red)} .insight.amber i{background:var(--amber)} .insight.green i{background:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:0 13px;min-height:40px;border-radius:20px;font-size:13.5px;border:1px solid var(--rule);color:var(--ink-2)}
.chip:active{background:var(--paper-2)}
.chip b{font-variant-numeric:tabular-nums;font-weight:600}
.chip.ok{border-color:var(--green);color:var(--green)}
.chip.warn{border-color:var(--amber);color:var(--amber)}
.chip.over{border-color:var(--red);color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.chips.period{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:2px -16px 10px;padding:0 16px 2px}
.chips.period::-webkit-scrollbar{display:none}
.chips.period .chip{flex:0 0 auto}
.chips.period .chip{padding:0 12px;font-size:13px}
.chip.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bignum{font-size:28px;font-weight:600;letter-spacing:-.01em;margin:2px 0 0;font-variant-numeric:tabular-nums;display:flex;align-items:center}
.pbar{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin:6px 0 10px}
.pbar .pseg{height:100%;min-width:3px}
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 0;min-height:48px;border-bottom:1px solid var(--rule);align-items:center;width:100%;text-align:left}
.crow .cname{display:flex;align-items:center;min-width:0}
.crow .cname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .amt{font-variant-numeric:tabular-nums;font-weight:500}
.crow .pct{color:var(--ink-3);font-size:12.5px;margin-left:6px;flex:0 0 auto}
.crow .cdelta{grid-column:1/-1;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.crow .bar{grid-column:1/-1;margin-top:4px;overflow:visible}
.up{color:var(--red)} .down{color:var(--green)}
.cmp{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.cmp th,.cmp td{padding:8px 3px;border-bottom:1px solid var(--rule);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:normal}
.cmp th{font-weight:500;color:var(--ink-2);font-size:12px}
.cmp tr.total td{font-weight:600}
.chart{display:block;width:100%;height:auto;margin:6px 0 4px}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--ink-3)}
.chart .pv{font-size:11px;fill:var(--ink);font-weight:600}
.chart .lab{fill:var(--ink);font-weight:500}
.chart .tl{font-size:11.5px;fill:#fff;font-weight:600}
.chart .tl2{font-size:10.5px;fill:#fff;opacity:.9}
.chart [data-act],.chart [data-tip]{cursor:pointer}
.chart g.sel circle.dot{r:5.5}
.chart rect.sel,.chart path.sel{stroke:var(--ink);stroke-width:1.5}
#tip{position:fixed;z-index:45;transform:translate(-50%,calc(-100% - 10px));background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:8px;font-size:13px;white-space:nowrap;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#tip::after{content:'';position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.pagehead .opts{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;color:var(--ink-2);border:1px solid var(--rule-strong)}
.pagehead .opts svg{width:22px;height:22px;fill:currentColor}
.menu .item{min-height:56px}
.emo{margin-right:6px;font-size:.95em}
.rep{font-style:normal;color:var(--ink-3);margin-left:6px;font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--paper-2);color:var(--ink-2);margin-left:6px;vertical-align:1px}
.tag.on{background:color-mix(in srgb,var(--green) 18%,var(--paper-2));color:var(--green)}
.rev{padding:10px 0;border-bottom:1px solid var(--rule)}
.rev .rtop{display:flex;gap:10px;align-items:baseline}
.rev .rtop .payee{flex:1;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rev .date{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rev .amt{font-variant-numeric:tabular-nums;font-weight:600}
.rev .ract{display:flex;gap:8px;align-items:center;margin-top:8px}
.rev select{flex:1;height:44px;border:1px solid var(--rule-strong);border-radius:10px;background:transparent;padding:0 8px;min-width:0;font-size:16px}
.brow .name{flex-wrap:wrap}
.brow .lft{flex-basis:100%;font-size:12px;color:var(--ink-3);font-weight:400;margin-top:1px;padding-left:18px}
.brow.child .lft{padding-left:0}
.hero .day{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--ink-2)}
.hero .day b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.center{display:flex;justify-content:center;margin:6px 0 10px}
.donut .dl{font-size:20px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
.donut .ds{font-size:11px;fill:var(--ink-3)}
.donut circle[data-act]{cursor:pointer}
.ring .rl{font-size:18px;font-weight:600;fill:var(--ink);font-variant-numeric:tabular-nums}
.bar .mark{position:absolute;top:-2px;width:2px;height:9px;background:var(--ink-2)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.p{border:1.5px dashed var(--ink-3);background:transparent;box-sizing:border-box}
.legend i.mk{width:2px;height:10px;background:var(--ink-2);border-radius:0}
.krow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule)}
.krow .amt{font-variant-numeric:tabular-nums;font-weight:500}
.krow.total{font-weight:600;border-bottom:0}
.krow .sub{color:var(--ink-3);font-size:12.5px;margin-left:8px;font-weight:400}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{padding:10px 12px;border:1px solid var(--rule);border-radius:10px;min-width:0}
.tile .v{font-size:clamp(16px,5.2vw,20px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .l{font-size:12.5px;color:var(--ink-2)}
.tile .d{font-size:12px;margin-top:2px;font-variant-numeric:tabular-nums}

.bgroup{margin:18px 0 0}
.brow{padding:10px 0;border-bottom:1px solid var(--rule)}
.brow.child{padding-left:18px}
.brow .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brow .top .name{flex:1 1 140px}
.brow .name{font-weight:500;display:flex;align-items:center;min-width:0;text-align:left}
.brow.parent .name{font-size:16px}
.brow .nums{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:0 0 auto}
.brow .nums input{width:96px;height:40px;text-align:right;border:1px solid var(--rule-strong);border-radius:8px;background:transparent;padding:0 8px;font-variant-numeric:tabular-nums;font-size:16px}
.brow .nums .sumv{font-size:16px;font-weight:600;color:var(--ink);min-width:96px;text-align:right;display:inline-block}
.bar{height:5px;background:var(--paper-2);border-radius:3px;margin-top:8px;overflow:hidden;position:relative}
.bar div{height:100%;border-radius:3px;max-width:100%}
.bar div.over{background:var(--red)!important}
.bar .tick{position:absolute;top:0;width:2px;height:100%;background:var(--amber)}

.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 0;min-height:52px;border-bottom:1px solid var(--rule);text-align:left}
.item .sub{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.item .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.item .chev{color:var(--ink-3)}
.item.child{padding-left:18px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:14px;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.kv b{color:var(--ink);font-weight:500;text-align:right}

table.prev{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.prev td,.prev th{padding:6px 4px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.prev th{font-weight:500;color:var(--ink-2)}
.prev td.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.counts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px;margin:12px 0 4px;font-size:14px}
.counts span{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:6px 0}
.counts b{font-variant-numeric:tabular-nums;font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:10px;display:flex;gap:18px;align-items:center;z-index:40;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast button{color:var(--paper);font-weight:600;text-decoration:underline;white-space:nowrap;min-height:40px;padding:0 6px}
#lock{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
#lock .card{width:100%;max-width:360px;text-align:center}
#lock h2{margin:14px 0 4px;font-size:24px;font-weight:600}
#lock p{margin:0 0 18px;color:var(--ink-2)}
#lock input{width:100%;height:56px;text-align:center;font-size:28px;letter-spacing:.35em;border:1px solid var(--rule-strong);border-radius:12px;background:transparent;font-variant-numeric:tabular-nums}
#lock .actions{justify-content:center;margin-top:14px}
#lock .err{color:var(--red);min-height:20px;margin:8px 0 0;font-size:14px}
#lock .mark{width:64px;height:64px;border-radius:32px;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
#ask input{width:100%;height:48px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:10px;background:transparent;font-size:18px;margin:0 0 14px;letter-spacing:.2em;text-align:center}
#ask{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px}
#ask .card{background:var(--paper);border-radius:16px;padding:20px 18px 16px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#ask p{margin:0 0 16px;line-height:1.45}
#ask .actions{margin:0;justify-content:flex-end}
</style>
</head>

  <main id="view"><p class="empty">Opening your ledger…</p></main>
</div>

<noscript>Ledger needs JavaScript to run.</noscript>

<script>
'use strict';
const APP_VERSION='1.2.1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));

/* ================= storage ================= */
const DB_NAME='ledger', DB_VERSION=3;
const STORES=['meta','accounts','categories','transactions','budgets','rules','importBatches','fuel','schedules'];
let db=null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{const d=req.result;for(const s of STORES){if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});}};
    req.onsuccess=()=>{const d=req.result;d.onversionchange=()=>{try{d.close();}catch{}};resolve(d);};
    req.onerror=()=>reject(req.error);
  });
}
function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);});}
function dbPutMany(store,arr){return new Promise((res,rej)=>{if(!arr.length)return res();const t=db.transaction(store,'readwrite');const os=t.objectStore(store);for(const o of arr)os.put(o);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function dbPut(store,obj){return dbPutMany(store,[obj]);}
function dbDeleteMany(store,ids){return new Promise((res,rej)=>{if(!ids.length)return res();const t=db.transaction(store,'readwrite');const os=t.objectStore(store);for(const id of ids)os.delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
function dbClear(store){return new Promise((res,rej)=>{const t=db.transaction(store,'readwrite');t.objectStore(store).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

/* ================= state ================= */
const S={accounts:[],categories:[],transactions:[],budgets:[],rules:[],batches:[],fuel:[],schedules:[],meta:{},
  tab:'home',month:'',period:1,openDetail:null,search:'',filterAccount:'',filterCat:'',filterReview:false,persisted:null,usage:null};
let deferredInstall=null;
let IMP=null;

const PALETTE=['#2F6DB5','#1F7A4D','#C25E1A','#7B4FB5','#1A8A9E','#B5382C','#B8781A','#C2456F','#5E7F1F','#8A6A32','#2A9D8F','#6B7C70'];
const NEUTRAL='#6B7C70';
const SEED=[
  {name:'Income',income:true,color:'#1F7A4D',emoji:'💰',children:['Salary','Other income']},
  {name:'Home',color:'#2F6DB5',emoji:'🏠',children:['Rent or bond','Levies and rates','Electricity and water','Internet and phone','Household']},
  {name:'Everyday',color:'#C25E1A',emoji:'🛒',children:['Groceries','Eating out','Coffee and snacks']},
  {name:'Transport',color:'#7B4FB5',emoji:'🚗',children:[['Fuel','cat_fuel'],'Car costs','Rides, parking and tolls']},
  {name:'Personal',color:'#1A8A9E',emoji:'🧴',children:['Clothing','Health and medical','Gym and sport','Personal care']},
  {name:'Leisure',color:'#C2456F',emoji:'🎉',children:['Entertainment','Subscriptions','Holidays and trips','Gifts and giving']},
  {name:'Money',color:'#B8781A',emoji:'🏦',children:['Insurance','Savings and investments','Debt repayments','Bank fees']},
  {name:'Other',color:'#8A6A32',emoji:'📦',children:['Other']},
];
const ACCOUNT_TYPES={cheque:'Cheque / current',savings:'Savings',credit:'Credit card',cash:'Cash',loan:'Loan',investment:'Investment'};

/* ================= utilities ================= */
const uid=()=>(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const nowISO=()=>new Date().toISOString();
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function todayStr(){return ymd(new Date());}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1);}
// A "month" in the app is a budget period. By default it is the calendar month; with a payday set it runs from that day to the day before the next one, and is named after the month it ends in.
const periodStartDay=()=>Math.min(28,Math.max(1,Number(S.meta.periodStart)||1));
function periodOf(date){const D=periodStartDay();const mk=date.slice(0,7);if(D===1)return mk;return Number(date.slice(8))>=D?mk:shiftMonth(mk,-1);}
function periodStart(mk){const D=periodStartDay();return D===1?mk+'-01':mk+'-'+pad(D);}
function periodEnd(mk){const D=periodStartDay();if(D===1)return mk+'-'+pad(daysInMonth(mk));return addDays(periodStart(shiftMonth(mk,1)),-1);}
function periodDays(mk){return daysBetween(periodStart(mk),periodEnd(mk))+1;}
function dayInPeriod(date){return daysBetween(periodStart(periodOf(date)),date)+1;}
const curPeriod=()=>periodOf(todayStr());
const nameKey=mk=>periodStartDay()===1?mk:shiftMonth(mk,1);
function monthLabel(mk){if(periodStartDay()!==1){const e=periodEnd(mk);return `${dateLabel(periodStart(mk))} to ${dateLabel(e)} ${e.slice(0,4)}`;}const [y,m]=mk.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'long',year:'numeric'});}
function monthName(mk){const [y,m]=nameKey(mk).split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'long'});}
function monthShort(mk){const [y,m]=nameKey(mk).split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-ZA',{month:'short'});}
function shiftMonth(mk,delta){const [y,m]=mk.split('-').map(Number);return monthKey(new Date(y,m-1+delta,1));}
function daysInMonth(mk){const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate();}
function dateLabel(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-ZA',{day:'2-digit',month:'short'});}
function dateLabelY(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-ZA',{day:'2-digit',month:'short',year:'numeric'});}
function longDate(ds){const [y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-ZA',{day:'numeric',month:'long'});}
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
const fmtFull=new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',minimumFractionDigits:2,maximumFractionDigits:2});
const fmtRound=new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:0});
const fmt=c=>fmtFull.format((c||0)/100);
const fmtShort=c=>fmtRound.format(Math.round((c||0)/100));
const fmtKm=n=>Math.round(n||0).toLocaleString('en-ZA')+' km';
const fmtNum=(n,d=1)=>Number(n||0).toLocaleString('en-ZA',{minimumFractionDigits:d,maximumFractionDigits:d});
function parseAmountInput(s){s=String(s??'').trim().replace(/[rR\s\u00a0\u202f]/g,'').replace(',','.');if(!s)return null;const n=Number(s);if(!isFinite(n))return null;return Math.round(n*100);}
function parseNum(s){s=String(s??'').trim().replace(/[\s\u00a0\u202f]/g,'').replace(',','.');if(!s)return null;const n=Number(s);return isFinite(n)?n:null;}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normText(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function titleCase(s){return s.toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g,(m,p,c)=>p+c.toUpperCase());}
function cleanPayee(desc){
  let s=String(desc||'').replace(/\s+/g,' ').trim();
  s=s.replace(/^(pos purchase|card purchase|debit card purchase|purchase|debit order|magtape debit|magtape credit|fnb app payment to|payment to|payment from|eft payment|internet pmt to|internet pmt from|cheque card purchase)\s*[:\-]?\s*/i,'');
  if(s&&/[a-z]/i.test(s)&&s===s.toUpperCase())s=titleCase(s);
  return s||String(desc||'').trim();
}

const live=()=>S.transactions.filter(t=>!t.deletedAt);
const catById=id=>S.categories.find(c=>c.id===id);
const accById=id=>S.accounts.find(a=>a.id===id);
const isTransfer=t=>t.categoryId==='cat_transfer'||!!t.transferId;
const inMonth=(t,mk)=>periodOf(t.date)===mk;

/* ================= categories ================= */
const bySort=(a,b)=>(a.sort??0)-(b.sort??0)||a.name.localeCompare(b.name);
const cats=()=>S.categories.filter(c=>!c.deletedAt);
const topCats=()=>cats().filter(c=>!c.parentId&&!c.system).sort(bySort);
const childrenOf=id=>cats().filter(c=>c.parentId===id).sort(bySort);
function topOf(id){const c=catById(id);if(!c)return null;return c.parentId?(catById(c.parentId)||c):c;}
const colorOf=id=>topOf(id)?.color||NEUTRAL;
const emojiOf=id=>topOf(id)?.emoji||'';
const catIcon=id=>{const e=emojiOf(id);return e?`<span class="emo">${esc(e)}</span>`:'';};
const catWithin=(id,parentOrSelf)=>id===parentOrSelf||catById(id)?.parentId===parentOrSelf;
let DATA_VER=0;
const isIncomeCat=id=>!!topOf(id)?.income;
const catName=id=>catById(id)?.name||'Uncategorised';
function fullName(id){const c=catById(id);if(!c)return 'Uncategorised';const p=c.parentId?catById(c.parentId):null;return p?`${p.name} › ${c.name}`:c.name;}
const partsOf=t=>(t.splits&&t.splits.length)?t.splits:[{categoryId:t.categoryId,amount:t.amount}];
const inCat=(t,catId)=>partsOf(t).some(p=>p.categoryId===catId||catById(p.categoryId)?.parentId===catId);
function isSpendPart(t,p){if(isTransfer(t))return false;if(isIncomeCat(p.categoryId))return false;if(p.categoryId==='cat_uncat'&&p.amount>0)return false;return true;}
function nextColor(){const used=new Set(topCats().map(c=>c.color));return PALETTE.find(c=>!used.has(c))||PALETTE[topCats().length%PALETTE.length];}
function seedCategories(){
  const list=[];let sort=0;
  for(const p of SEED){
    const pid=uid();list.push({id:pid,name:p.name,income:!!p.income,color:p.color,emoji:p.emoji||'',sort:sort++,createdAt:nowISO()});
    for(const ch of p.children){const [name,id]=Array.isArray(ch)?ch:[ch,uid()];list.push({id,name,parentId:pid,sort:sort++,createdAt:nowISO()});}
  }
  list.push({id:'cat_transfer',name:'Transfer',system:true,color:NEUTRAL,sort:900,createdAt:nowISO()});
  list.push({id:'cat_uncat',name:'Uncategorised',system:true,color:NEUTRAL,sort:901,createdAt:nowISO()});
  return list;
}
async function migrateCategories(){
  // v0.1 stored flat categories with a text "group"; turn each group into a parent category.
  const old=S.categories.filter(c=>!c.system&&c.parentId===undefined&&c.group!==undefined);
  if(!old.length)return;
  const parents={};let i=0;
  for(const c of old){
    const g=c.group||'Other';
    if(!parents[g])parents[g]={id:uid(),name:g,income:!!c.income,color:PALETTE[i++%PALETTE.length],sort:i,createdAt:nowISO()};
    c.parentId=parents[g].id;delete c.group;delete c.income;
  }
  for(const c of S.categories)if(c.system&&!c.color)c.color=NEUTRAL;
  S.categories.push(...Object.values(parents));
  await dbPutMany('categories',S.categories);
}
function fuelCatId(){
  const c=cats().find(c=>c.id==='cat_fuel')||cats().find(c=>c.name.toLowerCase()==='fuel'&&!c.system);
  return c?c.id:null;
}
async function ensureEmojis(){
  const map={income:'💰',home:'🏠',everyday:'🛒',transport:'🚗',personal:'🧴',leisure:'🎉',money:'🏦',other:'📦'};
  const changed=[];for(const c of topCats()){if(c.emoji===undefined){c.emoji=map[c.name.toLowerCase()]||'';changed.push(c);}}
  if(changed.length)await dbPutMany('categories',changed);
}
async function ensureFuelCat(){
  if(fuelCatId())return;
  const transport=topCats().find(c=>/transport/i.test(c.name));
  const c=transport?{id:'cat_fuel',name:'Fuel',parentId:transport.id,sort:50,createdAt:nowISO()}:{id:'cat_fuel',name:'Fuel',color:nextColor(),sort:50,createdAt:nowISO()};
  S.categories.push(c);await dbPut('categories',c);
}
function catOptions(kind,selected){
  const tops=topCats().filter(c=>kind==='income'?c.income:!c.income);
  let html='';
  for(const p of tops){
    const kids=childrenOf(p.id);
    html+=`<optgroup label="${esc(p.name)}"><option value="${p.id}" ${p.id===selected?'selected':''}>${esc(p.name)}${kids.length?' (no sub-category)':''}</option>${kids.map(c=>`<option value="${c.id}" ${c.id===selected?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>`;
  }
  html+=`<optgroup label="Other"><option value="cat_uncat" ${selected==='cat_uncat'?'selected':''}>Uncategorised</option></optgroup>`;
  return html;
}
function accOptions(selected){return S.accounts.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}</option>`).join('');}

/* ================= data operations ================= */
async function setMeta(k,v){S.meta[k]=v;await dbPut('meta',{id:k,value:v});}
async function upsertTxns(list){
  DATA_VER++;
  for(const t of list){const i=S.transactions.findIndex(x=>x.id===t.id);if(i>=0)S.transactions[i]=t;else S.transactions.push(t);}
  await dbPutMany('transactions',list);
}
async function upsert(store,arrName,obj){
  const arr=S[arrName];const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);
  await dbPut(store,obj);
}
async function loadAll(){
  const [accounts,categories,transactions,budgets,rules,batches,fuel,schedules,metaRows]=await Promise.all(
    ['accounts','categories','transactions','budgets','rules','importBatches','fuel','schedules','meta'].map(dbAll));
  Object.assign(S,{accounts,categories,transactions,budgets,rules,batches,fuel,schedules});
  S.meta={};for(const m of metaRows)S.meta[m.id]=m.value;
  if(!S.categories.length){S.categories=seedCategories();await dbPutMany('categories',S.categories);}
  await migrateCategories();
  await ensureFuelCat();
  await ensureEmojis();
  DATA_VER++;
}

/* ================= money maths ================= */
function isSpend(t){return partsOf(t).some(p=>isSpendPart(t,p));}
const spendAmount=t=>partsOf(t).reduce((a,p)=>a+(isSpendPart(t,p)?-p.amount:0),0);
function spentLeaf(mk){const m={};for(const t of live()){if(!inMonth(t,mk))continue;for(const p of partsOf(t)){if(!isSpendPart(t,p))continue;m[p.categoryId]=(m[p.categoryId]||0)-p.amount;}}return m;}
function spentTop(mk){const leaf=spentLeaf(mk),m={};for(const [id,v] of Object.entries(leaf)){const t=topOf(id);const k=t?t.id:'cat_uncat';m[k]=(m[k]||0)+v;}return m;}

function weekdayProfile(months){
  const set=new Set(months);const sums=[0,0,0,0,0,0,0],counts=[0,0,0,0,0,0,0];const today=todayStr();
  for(const m of months){const st=periodStart(m),n=periodDays(m);for(let i=0;i<n;i++){const ds=addDays(st,i);if(ds>today)break;const [y,mo,dd]=ds.split('-').map(Number);counts[(new Date(y,mo-1,dd).getDay()+6)%7]++;}}
  for(const t of live()){if(!set.has(periodOf(t.date))||!isSpend(t))continue;const [y,mo,dd]=t.date.split('-').map(Number);sums[(new Date(y,mo-1,dd).getDay()+6)%7]-=t.amount;}
  return sums.map((v,i)=>counts[i]?Math.round(v/counts[i]):0);

function lineChartSVG(labels,series,{height=160,avg=null,unit='money'}={}){
  const W=360,H=height,padL=40,padR=12,padT=14,padB=22,n=labels.length;
  const all=series.flatMap(x=>x.values).filter(v=>v!=null);if(!all.length)return '';
  const max=Math.max(1e-9,...all,avg||0);const lo=Math.min(0,...all);const step=niceStep(Math.max(max,-lo));const top=Math.ceil(max/step)*step;const bottom=lo<0?-Math.ceil(-lo/step)*step:0;
  const x=i=>n===1?W/2:padL+(W-padL-padR)*i/(n-1);const y=v=>padT+(H-padT-padB)*(1-(v-bottom)/(top-bottom||1));
  const fv=unit==='money'?fmtAxis:unit==='dec2'?v=>fmtNum(v,2):unit==='dec1'?v=>fmtNum(v,1):v=>fmtNum(v,0);
  let g='';for(let v=bottom;v<=top+1e-9;v+=step)g+=`<line x1="${padL}" x2="${W-padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="grid"${v===0&&bottom<0?' style="stroke:var(--ink-3)"':''}/><text x="${padL-4}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" class="ax">${fv(v)}</text>`;
  const every=n>12?3:n>8?2:1;let lx='';labels.forEach((l,i)=>{if(i===n-1||(i%every===0&&n-1-i>=every))lx+=`<text x="${x(i).toFixed(1)}" y="${H-6}" text-anchor="${i===n-1?'end':i===0?'start':'middle'}" class="ax">${esc(l)}</text>`;});
  let paths='';
  for(const sr of series){const pts=[];sr.values.forEach((v,i)=>{if(v!=null)pts.push({x:x(i),y:y(v),i,v});});if(!pts.length)continue;
    const d=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
    const area=`${d} L${pts[pts.length-1].x.toFixed(1)} ${y(0).toFixed(1)} L${pts[0].x.toFixed(1)} ${y(0).toFixed(1)} Z`;
    const last=pts[pts.length-1];
    paths+=`<path d="${area}" style="fill:${sr.color}" opacity=".12"/><path d="${d}" fill="none" style="stroke:${sr.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<g class="pt" data-tip="${esc(labels[p.i])}: ${fv(p.v)}"><circle class="dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" style="fill:${sr.color}"/><circle class="hit" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="14" fill="transparent"><title>${esc(labels[p.i])}: ${fv(p.v)}</title></circle></g>`).join('')}<text x="${last.x.toFixed(1)}" y="${(last.y-8).toFixed(1)}" text-anchor="${last.i===n-1?'end':'middle'}" class="pv">${fv(last.v)}</text>`;}
  const avgL=avg?`<line x1="${padL}" x2="${W-padR}" y1="${y(avg).toFixed(1)}" y2="${y(avg).toFixed(1)}" style="stroke:var(--ink-2)" stroke-dasharray="4 3"/><text x="${padL+4}" y="${(y(avg)-4).toFixed(1)}" text-anchor="start" class="ax">avg ${fv(avg)}</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${avgL}${paths}${lx}</svg>`;
}
function limitBar(spent,limit,color,projected){
  if(!limit)return '';
  const pct=Math.min(100,Math.max(0,spent/limit*100));const st=statusOf(spent,limit);
  const tick=projected&&projected>spent&&projected/limit<1?`<div class="tick" style="left:${(projected/limit*100).toFixed(1)}%" title="Projected"></div>`:'';
  return `<div class="bar"><div class="${st}" style="width:${pct.toFixed(1)}%;background:${color}"></div>${tick}</div>`;
}

const fuelLive=()=>S.fuel.filter(f=>!f.deletedAt).sort((a,b)=>a.date.localeCompare(b.date)||a.odometer-b.odometer);
function fuelStats(mk){
  const list=fuelLive();let km=0,litres=0,cost=0,n=0;
  for(let i=0;i<list.length;i++){const f=list[i];if(periodOf(f.date)!==mk)continue;n++;cost+=f.cost;litres+=f.litres;if(i>0&&f.odometer>list[i-1].odometer)km+=f.odometer-list[i-1].odometer;}
  return {km,litres,cost,n,ppl:litres?cost/litres:0,costPerKm:km?cost/km:0};
}
function consumptionSeries(){
  const list=fuelLive();const segs=[];let lastFull=-1;
  for(let i=0;i<list.length;i++){
    if(!list[i].full)continue;
    if(lastFull>=0){let litres=0;for(let j=lastFull+1;j<=i;j++)litres+=list[j].litres;const km=list[i].odometer-list[lastFull].odometer;if(km>0&&litres>0)segs.push({date:list[i].date,value:litres/km*100});}
    lastFull=i;
  }
  return segs;
}
function consumption(){const recent=consumptionSeries().slice(-6);return recent.length?recent.reduce((a,x)=>a+x.value,0)/recent.length:null;}
function drivingPace(){
  const list=fuelLive();if(list.length<2)return null;
  const last=list[list.length-1];const cutoff=addDays(last.date,-90);
  let first=list.find(f=>f.date>=cutoff);if(!first||first===last)first=list[list.length-2];
  const days=Math.max(1,daysBetween(first.date,last.date));const km=last.odometer-first.odometer;
  return km>0?km/days:null;
}
function serviceForecast(){
  const fs=S.meta.fuel||{};const list=fuelLive();if(!list.length||fs.lastServiceKm==null)return null;
  const odo=list[list.length-1].odometer;const interval=fs.intervalKm||15000;const next=fs.lastServiceKm+interval;const remaining=next-odo;
  const pace=drivingPace();const days=pace&&remaining>0?Math.round(remaining/pace):null;
  return {next,remaining,pace,days,date:days!=null?addDays(todayStr(),days):null,progress:Math.min(1,Math.max(0,(odo-fs.lastServiceKm)/interval)),odo};
}

function parseFuelText(text){
  const today=todayStr();const blocks=[];let cur=null;
  const num=v=>Number(String(v).replace(',','.'));
  for(const raw of String(text||'').replace(/\r/g,'').split('\n')){
    let l=raw.trim();if(!l)continue;
    let wa=null;const pm=l.match(/^\[?(\d{1,2}[\/.]\d{1,2}[\/.]\d{2,4}),?\s+\d{1,2}:\d{2}(?::\d{2})?\]?\s*(?:-\s*)?[^:]{0,40}:\s*(.*)$/);
    if(pm){wa=parseDate(pm[1].replace(/\./g,'/'),'dmy');l=pm[2].trim();}
    let date=null;let dm=l.match(/(?:^|[\s,;])(\d{1,2})\s+([A-Za-z]{3,})\.?(?:\s+(\d{4}))?(?=$|[\s,;])/);
    if(dm&&MONTHS[dm[2].slice(0,3).toLowerCase()]){const mon=MONTHS[dm[2].slice(0,3).toLowerCase()];const d=Number(dm[1]);let y=dm[3]?Number(dm[3]):Number(today.slice(0,4));let cand=y+'-'+pad(mon)+'-'+pad(d);if(!dm[3]&&cand>today){y--;cand=y+'-'+pad(mon)+'-'+pad(d);}if(d>=1&&d<=31)date=cand;}
    else{dm=l.match(/(?:^|[\s,;])(\d{1,2}[\/\-.]\d{1,2}[\/\-.]\d{2,4})(?=$|[\s,;])/);if(dm)date=parseDate(dm[1],'dmy');}
    if(!date&&wa&&!cur)date=wa;
    if(date){cur={date,km:null,extraKm:0,litres:null,price:null,cost:null,raw:[]};blocks.push(cur);}
    if(!cur)continue;
    cur.raw.push(l);
    const plus=l.match(/\+\s*(\d+(?:[.,]\d+)?)\s*km/i);if(plus){cur.extraKm+=num(plus[1]);}
    else{const km=l.match(/(?:^|[^\d.,+])(\d+(?:[.,]\d+)?)\s*km\b/i);if(km&&cur.km==null)cur.km=num(km[1]);}
    const lt=l.match(/(\d+(?:[.,]\d+)?)\s*(?:L|l|lt|litres?|liters?)\b(?![a-z])/);if(lt&&cur.litres==null&&!/km\b/i.test(lt[0]))cur.litres=num(lt[1]);
    for(const rm of l.matchAll(/R\s?(\d+(?:[.,]\d{1,2})?)(?![\d.,]*\s*(?:km|L\b))/g)){const v=num(rm[1]);if(!isFinite(v))continue;if(v<80){if(cur.price==null)cur.price=v;}else if(cur.cost==null)cur.cost=v;}
  }
  const out=[];
  for(const b of blocks){
    let {litres,price,cost}=b;
    if(cost!=null&&litres==null&&price)litres=cost/price;
    if(cost==null&&price!=null&&litres)cost=price*litres;
    if(!litres||!cost)continue;
    out.push({date:b.date,km:(b.km||0)+b.extraKm,adjusted:b.extraKm>0,litres:Math.round(litres*1000)/1000,cost:Math.round(cost*100),pricePerL:Math.round(cost*100/litres),raw:b.raw.join(' ')});
  }
  out.sort((a,b)=>a.date.localeCompare(b.date));
  return out;
}

  openSheet(ex?'Edit fill-up':'Log fill-up',html,`${ex?`<button class="btn danger" id="fuDel">Delete</button>`:''}<button class="btn primary" id="fuSave">${ex?'Save changes':'Log fill-up'}</button>`,{key:'fuel:'+(id||'new'),reopen:()=>openFuelSheet(id)});
  // Two inputs only: price per litre and litres. Neither ever rewrites the other, so it doesn't matter which you fill in first.
  const L=()=>parseNum($('#fuL').value),P=()=>parseAmountInput($('#fuP').value);
  const totalCents=()=>{const l=L(),p=P();return (l>0&&p>0)?Math.round(p*l):null;};
  const draw=()=>{const c=totalCents();const l=L(),p=P();
    $('#fuTotal').textContent=c==null?'—':fmt(c);
    $('#fuCalc').textContent=c!=null?`${fmtNum(l,2)} L at ${fmtNum(p/100,2)} a litre`:(l>0&&!(p>0))?'Now the price per litre.':(p>0&&!(l>0))?'Now the litres.':'Type the price per litre and the litres, in whichever order suits you. The pump\'s total is worked out for you.';};
  $('#fuP').oninput=draw;$('#fuL').oninput=draw;draw();
  $('#fuSave').onclick=async()=>{
    const odo=parseNum($('#fuOdo').value),litres=L(),price=P();
    if(!odo||odo<=0){toast('Enter the odometer reading');$('#fuOdo').focus();return;}
    if(!price||price<=0){toast('Enter the price per litre');$('#fuP').focus();return;}
    if(!litres||litres<=0){toast('Enter the litres');$('#fuL').focus();return;}
    const cost=Math.round(price*litres);
    const date=$('#fuDate').value||todayStr(),station=$('#fuSt').value.trim(),accountId=$('#fuAcc').value,note=$('#fuNote').value.trim(),now=nowISO();
    let shiftList=[],shiftDelta=0;
    if(ex&&Math.round(odo)!==ex.odometer){const delta=Math.round(odo)-ex.odometer;shiftDelta=delta;const earlier=fuelLive().filter(x=>x.id!==ex.id&&(x.date<ex.date||(x.date===ex.date&&x.odometer<ex.odometer)));
      if(earlier.length&&await ask(`Shift the ${earlier.length} earlier fill-up${earlier.length===1?'':'s'} by ${delta>0?'+':''}${delta.toLocaleString('en-ZA')} km as well, so the distances between them stay the same? Choose Cancel to change only this one.`,'Shift them too'))shiftList=earlier;}
    const f=Object.assign(ex||{id:uid(),createdAt:now},{date,odometer:Math.round(odo),litres:Math.round(litres*1000)/1000,cost,pricePerL:price,station,full:$('#fuFull').checked,note,updatedAt:now});
    if(shiftList.length){for(const x of shiftList){x.odometer+=shiftDelta;x.updatedAt=now;}await dbPutMany('fuel',shiftList);}
    let t=ex?S.transactions.find(x=>x.id===ex.transactionId):null;
    if(!t){t={id:uid(),createdAt:now,source:'manual',reviewed:true,note:''};f.transactionId=t.id;}
    Object.assign(t,{accountId,date,amount:-cost,payee:station||'Fuel',categoryId:fuelCatId()||'cat_uncat',fuelId:f.id,updatedAt:now});
    delete t.deletedAt;
    await upsertTxns([t]);await upsert('fuel','fuel',f);await setMeta('lastAccountId',accountId);
    sheetDone();S.month=periodOf(date);render();toast(ex?'Saved':'Fill-up logged');
  };
  if(ex)$('#fuDel').onclick=async()=>{
    const now=nowISO();ex.deletedAt=now;const t=S.transactions.find(x=>x.id===ex.transactionId);const list=[];if(t){t.deletedAt=now;list.push(t);}
    await upsert('fuel','fuel',ex);await upsertTxns(list);sheetDone();render();
    toast('Fill-up deleted',{action:'Undo',onAction:async()=>{delete ex.deletedAt;for(const x of list)delete x.deletedAt;await upsert('fuel','fuel',ex);await upsertTxns(list);render();}});
  };
}

/* ================= transaction sheet ================= */
function openTxnSheet(id,pre){
  const ex=id?S.transactions.find(t=>t.id===id):null;
  if(ex&&ex.fuelId&&S.fuel.find(f=>f.id===ex.fuelId&&!f.deletedAt)){openFuelSheet(ex.fuelId);return;}
  pre=pre||{};
  let kind=ex?(ex.transferId?'transfer':ex.amount>0?'income':'expense'):(pre.kind||'expense');
  const counterpart=ex&&ex.transferId?S.transactions.find(t=>t.transferId===ex.transferId&&t.id!==ex.id&&!t.deletedAt):null;
  const defaultAcc=ex?ex.accountId:(pre.accountId||(accById(S.meta.lastAccountId)?S.meta.lastAccountId:S.accounts[0]?.id));
  let fromId=defaultAcc,toId=S.accounts.find(a=>a.id!==defaultAcc)?.id||defaultAcc;
  if(ex&&counterpart){if(ex.amount<0){fromId=ex.accountId;toId=counterpart.accountId;}else{fromId=counterpart.accountId;toId=ex.accountId;}}
  const amt=ex?(Math.abs(ex.amount)/100).toFixed(2).replace('.',','):(pre.amount?(pre.amount/100).toFixed(2).replace('.',','):'');

async function saveTxnForm(ex,counterpart,getKind,pre,another,getSplits){
  const kind=getKind();const cents=parseAmountInput($('#fAmt').value);
  if(cents==null||cents<=0){toast('Enter an amount');$('#fAmt').focus();return;}
  const date=$('#fDate').value||todayStr();const note=$('#fNote').value.trim();const now=nowISO();
  if(kind==='transfer'){
    const from=$('#fFrom').value,to=$('#fTo').value;
    if(!from||!to||from===to){toast('Choose two different accounts');return;}
    const transferId=ex?.transferId||uid();
    const outEx=ex?(ex.amount<0?ex:counterpart):null,inEx=ex?(ex.amount<0?counterpart:ex):null;
    const a=Object.assign(outEx||{id:uid(),createdAt:now,source:'manual',reviewed:true},{accountId:from,date,amount:-cents,payee:'To '+(accById(to)?.name||''),categoryId:'cat_transfer',note,transferId,updatedAt:now});
    const b=Object.assign(inEx||{id:uid(),createdAt:now,source:'manual',reviewed:true},{accountId:to,date,amount:cents,payee:'From '+(accById(from)?.name||''),categoryId:'cat_transfer',note,transferId,updatedAt:now});
    await upsertTxns([a,b]);
  }else{
    const payee=$('#fPayee').value.trim();let categoryId=$('#fCat').value||'cat_uncat';const accountId=$('#fAcc').value;
    if(!accountId){toast('Add an account first');return;}
    const sr=(getSplits?getSplits():[]).filter(r=>r.cents>0);let splits=null;
    if(sr.length>=2){const sum=sr.reduce((a,r)=>a+r.cents,0);if(sum!==cents){toast(`The parts add up to ${fmt(sum)}, not ${fmt(cents)}`);return;}splits=sr.map(r=>({categoryId:r.categoryId,amount:kind==='expense'?-r.cents:r.cents}));categoryId=splits[0].categoryId;}
    const base=ex||{id:uid(),createdAt:now,source:'manual',reviewed:true};
    const t=Object.assign(base,{accountId,date,amount:kind==='expense'?-cents:cents,payee,categoryId,note,updatedAt:now});
    if(splits)t.splits=splits;else delete t.splits;
    if(t.transferId){delete t.transferId;if(counterpart){counterpart.deletedAt=now;await upsertTxns([counterpart]);}}
    const rev=$('#fRev');if(rev)t.reviewed=rev.checked;
    const rep=$('#fRepeat');const wantRepeat=!!(rep&&rep.checked);let sched=t.scheduleId?S.schedules.find(x=>x.id===t.scheduleId):null;let newSched=false;
    if(wantRepeat&&!sched){sched={id:uid(),payee,amount:t.amount,categoryId,accountId,day:Number(date.slice(8)),startMonth:date.slice(0,7),lastMonth:date.slice(0,7),active:true,note,createdAt:now,updatedAt:now};S.schedules.push(sched);await dbPut('schedules',sched);t.scheduleId=sched.id;newSched=true;}
    else if(sched){
      if(sched.active!==wantRepeat){sched.active=wantRepeat;sched.updatedAt=now;await dbPut('schedules',sched);}
      if(wantRepeat&&ex&&sched.amount!==t.amount&&await ask(`${payee||'This payment'} is scheduled at ${fmt(Math.abs(sched.amount))} a month. Use ${fmt(Math.abs(t.amount))} from next month too?`,'Update schedule')){sched.amount=t.amount;sched.updatedAt=now;await dbPut('schedules',sched);}
    }
    await upsertTxns([t]);await setMeta('lastAccountId',accountId);
    if(newSched){sheetDone();S.month=periodOf(date);render();toast(`Added. Repeats on the ${ord(sched.day)} of every month`);await runScheduled();return;}
    if(sched&&sched.active)await generateScheduled();
  }
  if(another){const acc=$('#fAcc')?$('#fAcc').value:undefined;toast('Added');S.month=periodOf(date);render();openTxnSheet(null,{accountId:acc,date});return;}
  sheetDone();toast(ex?'Saved':'Added');
  if(!ex)S.month=periodOf(date);
  render();
}
async function deleteTxn(id){
  const t=S.transactions.find(x=>x.id===id);if(!t)return;
  const now=nowISO();const list=[t];
  if(t.transferId){const c=S.transactions.find(x=>x.transferId===t.transferId&&x.id!==t.id&&!x.deletedAt);if(c)list.push(c);}
  for(const x of list)x.deletedAt=now;
  const f=t.fuelId?S.fuel.find(x=>x.id===t.fuelId):null;if(f){f.deletedAt=now;await upsert('fuel','fuel',f);}
  await upsertTxns(list);sheetDone();render();
  toast('Deleted',{action:'Undo',onAction:async()=>{for(const x of list)delete x.deletedAt;await upsertTxns(list);if(f){delete f.deletedAt;await upsert('fuel','fuel',f);}render();}});
}

    const diff=bank-accountBalance(ex);const now=nowISO();

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const sample=text.split(/\r?\n/).slice(0,25).join('\n');
  const counts=[[',',(sample.match(/,/g)||[]).length],[';',(sample.match(/;/g)||[]).length],['\t',(sample.match(/\t/g)||[]).length]];
  const delim=counts.sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],field='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}else field+=c;}
    else if(c==='"')inQ=true;
    else if(c===delim){row.push(field);field='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(f=>f.trim()!==''))rows.push(row);row=[];field='';}
    else field+=c;
  }
  if(field!==''||row.length){row.push(field);if(row.some(f=>f.trim()!==''))rows.push(row);}
  return rows.map(r=>r.map(f=>f.trim()));
}
const MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseDate(s,order){
  s=String(s||'').trim();let y,m,d,mm;
  if((mm=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))){y=+mm[1];m=+mm[2];d=+mm[3];}
  else if((mm=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})\b/))){const a=+mm[1],b=+mm[2];y=+mm[3];if(y<100)y+=2000;if(order==='mdy'){m=a;d=b;}else{d=a;m=b;}}
  else if((mm=s.match(/^(\d{1,2})[\s\-]+([A-Za-z]{3,})\.?[\s\-]+(\d{4}|\d{2})\b/))){d=+mm[1];m=MONTHS[mm[2].slice(0,3).toLowerCase()];y=+mm[3];if(y<100)y+=2000;}
  else if((mm=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/))){m=MONTHS[mm[1].slice(0,3).toLowerCase()];d=+mm[2];y=+mm[3];}
  else if((mm=s.match(/^(\d{4})(\d{2})(\d{2})$/))){y=+mm[1];m=+mm[2];d=+mm[3];}
  if(!y||!m||!d||m<1||m>12||d<1||d>31)return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseAmount(s){
  if(s==null)return null;s=String(s).trim();if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(/^-/.test(s)){neg=true;s=s.slice(1);}
  if(/-\s*$/.test(s)){neg=true;s=s.replace(/-\s*$/,'');}
  if(/\bDR\b/i.test(s))neg=true;
  s=s.replace(/[^\d.,]/g,'');if(!s)return null;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');let norm;
  if(lc>-1&&ld>-1)norm=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(lc>-1){const p=s.split(',');norm=(p.length===2&&p[1].length<=2)?p[0]+'.'+p[1]:p.join('');}
  else norm=s;
  const n=Number(norm);if(!isFinite(n))return null;
  return Math.round(n*100)*(neg?-1:1);
}
function looksLikeDate(s){return parseDate(s,'dmy')!==null;}
function detectTable(rows){
  const counts={};for(const r of rows)counts[r.length]=(counts[r.length]||0)+1;
  const modal=Number(Object.entries(counts).sort((a,b)=>b[1]-a[1]||b[0]-a[0])[0]?.[0]||0);
  const idx=rows.findIndex(r=>r.length===modal&&r.some(f=>/[A-Za-z]/.test(f))&&!r.some(f=>looksLikeDate(f)));
  const header=idx>=0?rows[idx]:Array.from({length:modal},(_,i)=>'Column '+(i+1));
  const data=rows.filter((r,i)=>r.length===modal&&i>idx);
  return {header,data,headerRow:idx};
}
function guessMapping(header,saved){
  const key=header.join('|');
  if(saved&&saved.headerKey===key)return {...saved};
  const find=re=>{const i=header.findIndex(h=>re.test(h));return i>=0?String(i):'';};
  const m={headerKey:key,date:find(/date/i),desc:find(/desc|narr|detail|memo|particular|transaction/i),desc2:find(/^ref|reference/i),balance:find(/balance/i),dateOrder:'dmy',invert:false};
  const debit=find(/debit|withdraw|money out|out$/i),credit=find(/credit|deposit|money in|in$/i);
  const amount=find(/^amount|amount$|^amt/i);
  if(debit&&credit&&!amount){m.mode='split';m.debit=debit;m.credit=credit;m.amount='';}
  else{m.mode='single';m.amount=amount||find(/amount/i);m.debit=debit;m.credit=credit;}
  if(!m.desc){const i=header.findIndex((h,i)=>String(i)!==m.date&&String(i)!==m.amount&&String(i)!==m.balance);m.desc=i>=0?String(i):'';}
  if(m.desc2===m.desc)m.desc2='';
  return m;
}
function parseImportRows(){
  const m=IMP.mapping,items=[];let errors=0;
  for(const r of IMP.rows){
    const date=m.date!==''?parseDate(r[+m.date],m.dateOrder):null;
    const desc=[m.desc!==''?r[+m.desc]:'',m.desc2!==''?r[+m.desc2]:''].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    let amount=null;
    if(m.mode==='split'){const d=m.debit!==''?parseAmount(r[+m.debit]):null,c=m.credit!==''?parseAmount(r[+m.credit]):null;if(d!=null||c!=null)amount=Math.abs(c||0)-Math.abs(d||0);}
    else if(m.amount!==''){amount=parseAmount(r[+m.amount]);if(amount!=null&&m.invert)amount=-amount;}
    const balance=m.balance!==''?parseAmount(r[+m.balance]):null;
    if(!date||amount==null){errors++;items.push({error:true,raw:r,date,desc,amount});continue;}
    items.push({date,desc,amount,balance,raw:r});
  }
  const seen={};
  for(const it of items){if(it.error)continue;const base=[IMP.accountId,it.date,it.amount,normText(it.desc),it.balance==null?'':it.balance].join('|');seen[base]=(seen[base]||0)+1;it.fingerprint=base+'|'+seen[base];}
  const existing=new Set(S.transactions.filter(t=>t.fingerprint).map(t=>t.fingerprint));
  const manual=live().filter(t=>t.accountId===IMP.accountId&&t.source!=='import'&&!t.fingerprint&&!isTransfer(t));
  const taken=new Set();
  for(const it of items){
    if(it.error)continue;
    if(existing.has(it.fingerprint)){it.status='skip';continue;}
    const cands=manual.filter(t=>!taken.has(t.id)&&t.amount===it.amount&&Math.abs(daysBetween(t.date,it.date))<=3).sort((a,b)=>Math.abs(daysBetween(a.date,it.date))-Math.abs(daysBetween(b.date,it.date)));
    if(cands.length){it.status='match';it.matchId=cands[0].id;taken.add(cands[0].id);}
    else it.status='new';
  }
  return {items,errors};
}
function openImporter(){
  if(!S.accounts.length){toast('Add an account first');return;}
  IMP={accountId:accById(S.meta.lastImportAccount)?S.meta.lastImportAccount:S.accounts[0].id,rows:null,mapping:null,fileName:''};
  const html=`<div class="field"><label for="impAcc">Statement is for</label><select id="impAcc">${accOptions(IMP.accountId)}</select></div>

function loadImportText(text){

  if(rows.length<2){$('#impMap').innerHTML='<p class="note bad">That file has no rows to import.</p>';return;}

function renderMapping(){
  const m=IMP.mapping,h=IMP.header;
  const colSel=(id,val)=>`<select data-map="${id}"><option value="">—</option>${h.map((c,i)=>`<option value="${i}" ${String(i)===String(val)?'selected':''}>${esc(c)}</option>`).join('')}</select>`;

    <div class="row2" id="mapSingle" ${m.mode==='single'?'':'hidden'}><div class="field"><label>Amount</label>${colSel('amount',m.amount)}</div><div class="field"><label>Sign</label><select data-map="invert"><option value="" ${!m.invert?'selected':''}>Minus is money out</option><option value="1" ${m.invert?'selected':''}>Minus is money in (flip)</option></select></div></div>
    <div class="row2" id="mapSplit" ${m.mode==='split'?'':'hidden'}><div class="field"><label>Money out</label>${colSel('debit',m.debit)}</div><div class="field"><label>Money in</label>${colSel('credit',m.credit)}</div></div>

function renderPreview(){

  const go=$('#impGo');go.disabled=!(c.new+c.match);go.textContent=c.new+c.match?`Import ${c.new+c.match}`:'Nothing new to import';

async function runImport(){
  if(!IMP||!IMP.parsed)return;
  const now=nowISO();const batch={id:uid(),accountId:IMP.accountId,fileName:IMP.fileName,createdAt:now,created:0,matched:0,skipped:0};
  const upserts=[];let latest='';
  for(const it of IMP.parsed){
    if(it.error)continue;
    if(it.status==='skip'){batch.skipped++;continue;}
    if(it.date>latest)latest=it.date;
    if(it.status==='match'){const t=S.transactions.find(x=>x.id===it.matchId);Object.assign(t,{fingerprint:it.fingerprint,importBatchId:batch.id,bankDescription:it.desc,matchedAt:now,reviewed:true,updatedAt:now});upserts.push(t);batch.matched++;continue;}
    const r=applyRules(it.desc);
    const payee=r.payee||cleanPayee(it.desc);
    upserts.push({id:uid(),accountId:IMP.accountId,date:it.date,amount:it.amount,payee,bankDescription:it.desc,categoryId:r.categoryId&&catById(r.categoryId)?r.categoryId:(lastCategoryForPayee(payee)||'cat_uncat'),note:'',source:'import',reviewed:false,fingerprint:it.fingerprint,importBatchId:batch.id,createdAt:now,updatedAt:now});

  await closeSheet();if(latest)S.month=periodOf(latest);switchTab('txns');
  toast(`Imported ${batch.created} new, matched ${batch.matched}`);
}
async function rollbackImport(id){
  const b=S.batches.find(x=>x.id===id);if(!b)return;
  if(!await ask(`Undo this import? ${b.created} imported transactions will be removed and ${b.matched} matched entries unlinked.`,'Undo import',true))return;
  const remove=[],unlink=[];
  for(const t of S.transactions){if(t.importBatchId!==id)continue;if(t.source==='import')remove.push(t.id);else{delete t.fingerprint;delete t.importBatchId;delete t.matchedAt;delete t.bankDescription;t.updatedAt=nowISO();unlink.push(t);}}
  S.transactions=S.transactions.filter(t=>!remove.includes(t.id));
  await dbDeleteMany('transactions',remove);await upsertTxns(unlink);
  S.batches=S.batches.filter(x=>x.id!==id);await dbDeleteMany('importBatches',[id]);
  render();toast('Import undone');
}

const csvEsc=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
async function shareFile(name,type,text){
  let shared=false;

}

/* ================= privacy: app lock and encrypted backups ================= */
const te=new TextEncoder(),td=new TextDecoder();
const b64=u8=>btoa(String.fromCharCode(...u8));
const unb64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
const randBytes=n=>{const u=new Uint8Array(n);crypto.getRandomValues(u);return u;};
async function pbkdf(pin,salt,iter,bits){const base=await crypto.subtle.importKey('raw',te.encode(String(pin)),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,bits));}
async function hashPin(pin,salt,iter){return b64(await pbkdf(pin,salt,iter,256));}
async function aesKey(pin,salt,iter){const bits=await pbkdf(pin,salt,iter,256);return crypto.subtle.importKey('raw',bits,'AES-GCM',false,['encrypt','decrypt']);}
async function encryptText(text,pin){const salt=randBytes(16),iv=randBytes(12),iter=150000;const key=await aesKey(pin,salt,iter);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(text)));return {app:'ledger-encrypted',v:1,salt:b64(salt),iv:b64(iv),iter,data:b64(ct)};}
async function decryptText(obj,pin){const key=await aesKey(pin,unb64(obj.salt),obj.iter||150000);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data));return td.decode(pt);}
const hasCrypto=()=>!!(globalThis.crypto&&crypto.subtle);
const hasBio=()=>!!(navigator.credentials&&navigator.credentials.create&&globalThis.PublicKeyCredential);
function askText(msg,opts={}){
  return new Promise(res=>{const a=$('#ask'),inp=$('#askIn');$('#askMsg').textContent=msg;inp.hidden=false;inp.type=opts.type||'password';inp.inputMode=opts.inputmode||'numeric';inp.value='';const ok=$('#askOk');ok.textContent=opts.okLabel||'OK';ok.className='btn primary';a.hidden=false;inp.focus();
    const done=v=>{a.hidden=true;inp.hidden=true;ok.onclick=null;$('#askNo').onclick=null;a.onclick=null;inp.onkeydown=null;res(v);};
    ok.onclick=()=>done(inp.value);$('#askNo').onclick=()=>done(null);a.onclick=e=>{if(e.target===a)done(null);};inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();done(inp.value);}};});
}
let hiddenAt=null,unlockResolve=null;
const lockCfg=()=>S.meta.lock||null;
function lockNow(){if(!lockCfg())return;S.locked=true;$('#lock').hidden=false;$('#lockPin').value='';$('#lockErr').textContent='';$('#lockBio').hidden=!(lockCfg().bio&&hasBio());$('#lockMsg').textContent=lockCfg().bio&&hasBio()?'Enter your PIN or use your fingerprint':'Enter your PIN';setTimeout(()=>{if(lockCfg().bio&&hasBio())bioUnlock();else $('#lockPin').focus();},50);}
function unlockDone(){S.locked=false;$('#lock').hidden=true;$('#lockPin').value='';const r=unlockResolve;unlockResolve=null;if(r)r();}
function showLock(){return new Promise(res=>{unlockResolve=res;lockNow();});}
async function tryPin(){
  const cfg=lockCfg();if(!cfg)return unlockDone();
  const fail=S.meta.lockFail||{count:0,until:0};const now=Date.now();
  if(fail.until>now){$('#lockErr').textContent=`Too many attempts. Try again in ${Math.ceil((fail.until-now)/1000)} s`;return;}
  const pin=$('#lockPin').value;if(!pin)return;
  const h=await hashPin(pin,unb64(cfg.salt),cfg.iter);
  if(h===cfg.hash){await setMeta('lockFail',{count:0,until:0});unlockDone();return;}
  const count=fail.count+1;const wait=count>=5?30000*Math.pow(2,Math.min(4,count-5)):0;
  await setMeta('lockFail',{count,until:wait?now+wait:0});
  $('#lockPin').value='';$('#lockErr').textContent=wait?`Wrong PIN. Try again in ${Math.round(wait/1000)} s`:`Wrong PIN${count>=3?`, ${5-count} tr${5-count===1?'y':'ies'} before a pause`:''}`;$('#lockPin').focus();
}
async function bioUnlock(){
  const cfg=lockCfg();if(!cfg||!cfg.bio||!hasBio())return;
  try{const cred=await navigator.credentials.get({publicKey:{challenge:randBytes(32),allowCredentials:[{type:'public-key',id:unb64(cfg.bio),transports:['internal']}],userVerification:'required',timeout:60000}});if(cred)unlockDone();}
  catch(e){$('#lockErr').textContent='Fingerprint not confirmed. Use your PIN.';$('#lockPin').focus();}
}
async function bioRegister(){
  if(!hasBio()){toast("This phone or browser doesn't offer fingerprint sign-in here");return false;}
  try{const cred=await navigator.credentials.create({publicKey:{challenge:randBytes(32),rp:{name:'Ledger'},user:{id:randBytes(16),name:'ledger',displayName:'Ledger'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
    const cfg=Object.assign({},lockCfg(),{bio:b64(new Uint8Array(cred.rawId))});await setMeta('lock',cfg);return true;}
  catch(e){toast('Fingerprint setup was cancelled');return false;}
}
async function setPin(pin){const salt=randBytes(16),iter=150000;const cfg=Object.assign({autoLock:0},lockCfg()||{},{hash:await hashPin(pin,salt,iter),salt:b64(salt),iter});delete cfg.bio;await setMeta('lock',cfg);await setMeta('lockFail',{count:0,until:0});}
async function verifyPin(pin){const cfg=lockCfg();if(!cfg)return true;return (await hashPin(pin,unb64(cfg.salt),cfg.iter))===cfg.hash;}
async function askForPin(msg){for(let i=0;i<3;i++){const p=await askText(msg||'Enter your PIN',{okLabel:'Continue'});if(p===null)return null;if(await verifyPin(p))return p;toast('Wrong PIN');}return null;}
async function newPinFlow(change){
  if(!hasCrypto()){toast('A PIN needs a secure (https) address');return;}
  if(change&&lockCfg()){if(await askForPin('Enter your current PIN')===null)return;}
  const a=await askText(change?'New PIN (4 to 12 digits)':'Choose a PIN (4 to 12 digits)',{okLabel:'Next'});if(a===null)return;
  if(!/^\d{4,12}$/.test(a)){toast('Use 4 to 12 digits');return;}
  const b=await askText('Enter it again',{okLabel:'Set PIN'});if(b===null)return;
  if(a!==b){toast("The two entries didn't match");return;}
  await setPin(a);render();toast(change?'PIN changed':'PIN set. Ledger will ask for it when it opens');
}
async function removePinFlow(){if(await askForPin('Enter your PIN to remove the lock')===null)return;S.meta.lock=undefined;await dbDeleteMany('meta',['lock']);delete S.meta.lock;render();toast('Lock removed');}
$('#lockGo').onclick=tryPin;$('#lockPin').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryPin();}});$('#lockBio').onclick=bioUnlock;
document.addEventListener('visibilitychange',()=>{const cfg=lockCfg();if(!cfg)return;if(document.hidden){hiddenAt=Date.now();return;}if(S.locked||hiddenAt==null)return;const mins=cfg.autoLock??0;if(mins<0)return;if(mins===0||Date.now()-hiddenAt>=mins*60000)lockNow();hiddenAt=null;});
function viewPrivacy(){
  const cfg=lockCfg();const bio=!!(cfg&&cfg.bio);const enc=S.meta.encryptBackups!==false;
  return `<div class="section"><h3>Privacy</h3><p class="note">Everything Ledger knows stays on this phone. Nothing is sent anywhere; the address you installed it from only serves the app itself.</p>
    ${cfg?`<div class="kv"><span>App lock</span><b>On</b></div><div class="actions"><button class="btn" data-act="pin-change">Change PIN</button><button class="btn" data-act="pin-remove">Remove lock</button>${hasBio()?`<button class="btn" data-act="${bio?'bio-remove':'bio-add'}">${bio?'Remove fingerprint':'Add fingerprint unlock'}</button>`:''}</div>
      <div class="field"><label for="autoLock">Lock again after switching apps</label><select id="autoLock"><option value="0" ${(cfg.autoLock??0)===0?'selected':''}>Straight away</option><option value="1" ${cfg.autoLock===1?'selected':''}>After 1 minute</option><option value="5" ${cfg.autoLock===5?'selected':''}>After 5 minutes</option><option value="15" ${cfg.autoLock===15?'selected':''}>After 15 minutes</option><option value="-1" ${cfg.autoLock===-1?'selected':''}>Only when the app is opened</option></select></div>
      <div class="field"><label class="chk"><input type="checkbox" id="encBackups" ${enc?'checked':''}>Encrypt backups with the PIN</label><span class="note">A backup file in Google Drive can then only be opened with your PIN. Keep the PIN safe: without it an encrypted backup can't be restored.</span></div>`
      :`<p class="note">Add a PIN so that someone with your phone can't open Ledger. On phones that support it you can then unlock with your fingerprint instead.</p><div class="actions"><button class="btn primary" data-act="pin-set">Set a PIN</button></div>`}</div>`;
}
